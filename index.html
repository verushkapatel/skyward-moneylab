<style>
/* One world: Skyward navy with cream type and cream accents, from the logo. Phone-width column, top bar, one screen at a time, bottom tabs with a centre add button. */
:root{
  --navy:#002850; --card:#063360; --raise:#0B3E70; --line:rgba(246,246,225,.13);
  --cream:#F6F6E1; --cream-2:rgba(246,246,225,.76); --cream-3:rgba(246,246,225,.52); --soft:rgba(246,246,225,.08);
  --need:#9CC3E8; --want:#E9B7A0; --save:#A3DDB8;
  --good:#A3DDB8; --good-bg:rgba(163,221,184,.13); --warn:#F2D08A; --warn-bg:rgba(242,208,138,.13); --bad:#F7AE9F; --bad-bg:rgba(247,174,159,.13);
  --display:"Playfair Display","Noto Serif Devanagari",Georgia,serif;
  --ui:"Inter","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--navy)}
body{background:var(--navy);color:var(--cream);font:16px/1.55 var(--ui);padding-inline:20px;padding-block:0 112px;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto}
h1,h2,h3{color:var(--cream);text-wrap:balance;margin:0;font-weight:700}
h1{font:800 clamp(1.9rem,7.5vw,2.5rem)/1.12 var(--display);letter-spacing:-.01em}
h2{font:700 1.5rem/1.22 var(--display)}
h3{font:600 1.02rem/1.35 var(--ui)}
:lang(hi) h1,:lang(mr) h1,:lang(hi) h2,:lang(mr) h2{line-height:1.38;letter-spacing:0}
p{margin:0}
.label{font:600 .72rem/1.25 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cream-3)}
:lang(hi) .label,:lang(mr) .label{letter-spacing:.02em;font-size:.82rem}
.dim{color:var(--cream-2)} .faint{color:var(--cream-3)} .sm{font-size:.88rem} .xs{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--cream);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0}
.brand img{width:36px;height:36px;border-radius:50%;flex:none}
.brand b{font:700 1.1rem/1.1 var(--display);white-space:nowrap}
.acts{display:flex;gap:8px;position:relative;align-items:center}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:.84rem;font-weight:600}
.ibtn:hover{background:var(--soft)}
.ibtn.round{padding:0;width:38px}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--cream);color:var(--navy);font:700 1rem/1 var(--ui);display:grid;place-items:center}
.menu{position:absolute;right:0;top:46px;background:var(--raise);border-radius:14px;padding:6px;min-width:150px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:10}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500}
.menu button:hover,.menu button[aria-checked="true"]{background:var(--soft)}
.menu button[aria-checked="true"]::after{content:" ✓";color:var(--cream-3)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(0,40,80,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 4px;font-size:.7rem;font-weight:600;color:var(--cream-3);position:relative}
nav.bottom button[aria-current="page"]{color:var(--cream)}
nav.bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:3px;background:var(--cream)}
nav.bottom svg.i{width:23px;height:23px}
nav.bottom .plus span.c{width:52px;height:52px;border-radius:50%;background:var(--cream);color:var(--navy);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
nav.bottom .plus span.c svg{width:26px;height:26px;stroke-width:2.2}

.screen{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.card{background:var(--card);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--cream);background:var(--cream);color:var(--navy);padding:13px 18px;border-radius:14px;font-weight:700;min-height:50px;font-size:.98rem}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(247,174,159,.4)}
.btn.sm{padding:8px 14px;min-height:40px;font-size:.88rem;border-radius:12px}
.btn.block{width:100%}
.btn.flex{flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--cream-2);font-weight:600;padding:6px 0;text-decoration:underline;text-decoration-color:var(--cream-3);text-underline-offset:4px}
.back{border:0;background:none;color:var(--cream-2);font-weight:600;padding:6px 0;display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 .74rem/1 var(--ui);padding:6px 10px;border-radius:99px;background:var(--soft);color:var(--cream-2)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.field label{font-size:.84rem;font-weight:600;color:var(--cream-2)}
.field input,.field textarea,.field select{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18);color:var(--cream);min-width:0;font-size:1rem}
.field input::placeholder,.field textarea::placeholder{color:var(--cream-3)}
.field input:focus,.field textarea:focus{border-color:var(--cream-2);outline:none}
.field textarea{min-height:92px;resize:vertical}
.field textarea.mono{font:.8rem/1.4 ui-monospace,Menlo,monospace}
.big-input{font:700 2rem/1.2 var(--ui)!important;padding:12px 14px!important}
.pw{position:relative}
.pw input{padding-right:76px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--cream-2);font-weight:600;font-size:.82rem;padding:8px 10px}
.err{color:var(--bad);font-size:.9rem;font-weight:500}
.ok{color:var(--good);font-size:.9rem;font-weight:500}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.92rem;color:var(--cream-2)}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--cream)}
.note{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem;background:var(--soft);color:var(--cream-2)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:99px;font-weight:600;font-size:.9rem;color:var(--cream-2)}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--navy)}
.subtabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0A3765;box-shadow:0 0 0 6px var(--navy);border-radius:14px;padding:4px;gap:2px;position:sticky;top:calc(66px + env(safe-area-inset-top,0px));z-index:5;backdrop-filter:blur(8px)}
.subtabs button{border:0;background:none;padding:9px 4px;border-radius:11px;font-weight:600;font-size:.84rem;color:var(--cream-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtabs button[aria-pressed="true"]{background:var(--cream);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 14px;font-size:.88rem;font-weight:600;color:var(--cream-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--cream);border-color:var(--cream);color:var(--navy)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.need{background:var(--need)} .dot.want{background:var(--want)} .dot.save{background:var(--save)} .dot.in{background:var(--cream)}

/* Welcome */
.welcome{display:flex;flex-direction:column;gap:24px;padding-top:16px;text-align:center;align-items:center}
.welcome .logo{width:124px;height:124px;border-radius:50%}
.welcome p.lead{color:var(--cream-2);max-width:36ch}
.perks{display:grid;gap:16px;text-align:left;width:100%}
.perk{display:flex;gap:14px;align-items:flex-start}
.perk .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.cta{display:flex;flex-direction:column;gap:10px;width:100%}
.credit{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;color:var(--cream-3);border-top:1px solid var(--line);width:100%;padding-block:18px 0;text-align:center}
.credit b{color:var(--cream-2);font-weight:600}
.code{font:700 clamp(1rem,5.4vw,1.3rem)/1.3 ui-monospace,Menlo,monospace;letter-spacing:.04em;background:rgba(0,0,0,.2);border:1.5px dashed var(--cream-3);border-radius:14px;padding:18px 12px;text-align:center;white-space:nowrap;overflow-x:auto}

/* Money blocks */
.big{font:700 2.6rem/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big.neg{color:var(--bad)}
.splits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.splits div{min-width:0}.splits span{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--cream-3)}.splits b{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.02rem}
.sbar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--soft);gap:2px}
.sbar i{display:block;height:100%}
.sbar i.need{background:var(--need)} .sbar i.want{background:var(--want)} .sbar i.save{background:var(--save)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--cream-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cat{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.cat .bar{grid-column:1/-1;height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:6px}
.cat .bar i.need{background:var(--need)} .cat .bar i.want{background:var(--want)}
.cat.over .bar i{background:var(--bad)} .cat.close .bar i{background:var(--warn)}
.cat .amt{font-size:.86rem;color:var(--cream-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month h1{font-size:clamp(1.5rem,6vw,1.9rem)}
.txday{font-size:.78rem;color:var(--cream-3);font-weight:600;padding:14px 0 4px;letter-spacing:.04em}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .lbl{min-width:0}.tx .lbl b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx .lbl small{color:var(--cream-3)}
.tx .amt{font-variant-numeric:tabular-nums;font-weight:600}
.tx .amt.in{color:var(--good)}
.x{border:0;background:transparent;color:var(--cream-3);font-size:1.3rem;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{background:var(--soft)}
.wid{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.wid:last-child{border-bottom:0;padding-bottom:0}.wid:first-child{padding-top:0}
.wid .bar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}.wid .bar i{display:block;height:100%;background:var(--save)}
.toggle{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--soft);flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--cream-3);transition:transform .2s,background .2s}
.toggle[aria-checked="true"]{background:var(--save)}
.toggle[aria-checked="true"]::after{transform:translateX(20px);background:var(--navy)}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:1.3rem;color:var(--cream-3)}
details[open]>summary::after{content:"−"}
.confirm{background:var(--bad-bg);border-radius:12px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--bad)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checklist button{width:100%;border:0;background:none;display:flex;gap:12px;align-items:center;padding:10px 0;text-align:left;color:var(--cream)}
.checklist .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--cream-3);display:grid;place-items:center;flex:none;font-size:.8rem}
.checklist .done .ck{background:var(--save);border-color:var(--save);color:var(--navy)}
.checklist .done span.t{color:var(--cream-3);text-decoration:line-through}
.cl2 li{border-bottom:1px solid var(--line)}.cl2 li:last-child{border-bottom:0}
.crow{display:flex;align-items:center;gap:10px}
.ckbtn{border:0;background:none;padding:12px 4px 12px 0;display:grid;place-items:center}
.ckbtn .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--cream-3);display:grid;place-items:center;font-size:.85rem;font-weight:700;transition:background .15s}
.cl2 .done .ck{background:var(--save);border-color:var(--save);color:var(--navy)}
.copen{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 0;display:flex;flex-direction:column;gap:2px;color:var(--cream)}
.copen .t{font-weight:600}
.cl2 .done .copen .t{color:var(--cream-3);text-decoration:line-through}
.crow .chev{color:var(--cream-3);font-size:1.3rem}
.cl2 .ckbtn{width:auto;flex:none}.cl2 .copen{width:auto;display:flex;align-items:flex-start}

/* Search, lists */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cream-3)}
.search input{padding-left:44px!important}
.item{width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.item:hover{background:var(--raise)}
.listbtn{width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center}
.listbtn:hover{background:var(--raise)}
.listbtn .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.listbtn .chev{color:var(--cream-3);font-size:1.3rem}
.sos{background:var(--bad-bg)} .sos:hover{background:rgba(247,174,159,.2)} .sos .ic{color:var(--bad)} .sos b{color:var(--bad)}
.rule{font:600 1.12rem/1.5 var(--display);border-left:2px solid var(--cream);padding-left:14px}
ol.steps,ul.warn{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;color:var(--cream-2)}
ul.warn li::marker{color:var(--warn)}
.story{font-size:1.02rem;line-height:1.65;color:var(--cream-2)}
.q{font:600 1.15rem/1.45 var(--display)}
.answer{border-radius:var(--r);background:var(--good-bg);padding:20px;display:flex;flex-direction:column;gap:12px}
.answer .label{color:var(--good)}
.nums{display:flex;flex-direction:column}
.nums div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.nums div:last-child{border-bottom:0}
.nums b{font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--cream)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card);border-radius:14px;padding:14px;min-width:0}
.stats b{display:block;font:700 1.4rem/1.2 var(--ui)}.stats span{font-size:.78rem;color:var(--cream-3)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,10,25,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--cream-3);margin:4px auto 6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--navy);padding:11px 18px;border-radius:99px;font-size:.9rem;font-weight:600;z-index:40;box-shadow:0 10px 24px rgba(0,0,0,.3);max-width:calc(100vw - 40px);text-align:center}

/* ---- v5: grown-up product styling ---- */
:root{--r:14px}
.card{border:1px solid var(--line)}
.btn{border-radius:10px;font-weight:600}
.btn.sm{border-radius:9px}
h1{font-size:clamp(1.75rem,6vw,2.3rem)}
.screen{animation:fade .22s ease-out}
@keyframes fade{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
nav.bottom .plus span.c{width:44px;height:44px;border-radius:12px;margin-top:-4px;box-shadow:none}
nav.bottom .plus span.c svg{width:22px;height:22px}
.ilogo{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font:600 .74rem/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--cream-2);text-align:left;max-width:180px}
.ilogo img{height:40px;width:auto}
.logos{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logos .sk{width:44px;height:44px;border-radius:50%}
.logos .div{width:1px;height:32px;background:var(--line)}
/* landing */
body.is-landing{padding-inline:0;padding-block:0}
body.is-landing .app{max-width:none}
body.is-landing .top{display:none}
.land{display:block}
.lwrap{max-width:1100px;margin:0 auto;padding-inline:20px}
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(0,40,80,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.lnav .lwrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.lnav .brandrow{display:flex;align-items:center;gap:10px}
.lnav .brandrow img{width:38px;height:38px;border-radius:50%}
.lnav .brandrow b{font:700 1.15rem/1 var(--display)}
.lnav .links{display:flex;gap:22px;align-items:center}
.lnav .links a{color:var(--cream-2);text-decoration:none;font-size:.92rem;font-weight:500}
.lnav .links a:hover{color:var(--cream)}
.lnav .right{display:flex;gap:8px;align-items:center}.lnav .right .btn{white-space:nowrap}@media (max-width:560px){#l-new{display:none}.lnav .brandrow b{font-size:1.05rem}}
@media (max-width:820px){.lnav .links{display:none}}
.hero{padding-block:64px 56px}
.hero .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
@media (max-width:860px){.hero .grid{grid-template-columns:1fr;gap:36px}.hero{padding-block:36px 40px}}
.hero h1{font:800 clamp(2.2rem,6vw,3.6rem)/1.06 var(--display);letter-spacing:-.015em}
:lang(hi) .hero h1,:lang(mr) .hero h1{line-height:1.3}
.hero p.lead{font-size:1.12rem;color:var(--cream-2);max-width:54ch;margin-top:18px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 .8rem/1 var(--ui);color:var(--cream-2);border:1px solid var(--line);border-radius:99px;padding:7px 12px;margin-bottom:20px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--save)}
.mock{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px rgba(0,0,0,.35);max-width:400px;justify-self:center;width:100%}
.mock .mini{background:rgba(0,0,0,.18);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mock .mrow{display:flex;align-items:center;gap:10px;font-size:.92rem}
.mock .mrow .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--cream-3);display:grid;place-items:center;font-size:.7rem;flex:none}
.mock .mrow.done .ck{background:var(--save);border-color:var(--save);color:var(--navy)}
.mock .mrow.done span{color:var(--cream-3);text-decoration:line-through}
.sec{padding-block:64px;border-top:1px solid var(--line)}
@media (max-width:700px){.sec{padding-block:44px}}
.sec .ey{font:600 .76rem/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cream-3);margin-bottom:14px}
:lang(hi) .sec .ey,:lang(mr) .sec .ey{letter-spacing:.02em;font-size:.84rem}
.sec h2{font:700 clamp(1.6rem,4vw,2.4rem)/1.2 var(--display);max-width:26ch}
.sec p.body{color:var(--cream-2);font-size:1.06rem;max-width:62ch;margin-top:16px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}
@media (max-width:980px){.fgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}

  one:X("Split your money: about half on needs, some on wants and a fixed part to savings. On a tight income, try 70/20/10.","पैसे बाँटें: लगभग आधा ज़रूरतों पर, कुछ इच्छाओं पर, और तय हिस्सा बचत में। कम आमदनी में 70/20/10 आज़माएँ।","पैसे वाटा: सुमारे अर्धे गरजांवर, काही इच्छांवर, आणि ठराविक भाग बचतीत. उत्पन्न कमी असेल तर 70/20/10 वापरून पहा."),
  how:[X("Every category is marked as a need or a want.","हर श्रेणी ज़रूरत या इच्छा के रूप में चिह्नित है।","प्रत्येक वर्ग गरज किंवा इच्छा म्हणून चिन्हांकित आहे."),X("Choose your split: 50/30/20 or 70/20/10.","अपना बँटवारा चुनें: 50/30/20 या 70/20/10।","तुमची विभागणी निवडा: 50/30/20 किंवा 70/20/10."),X("Check the bars on your Money page as the month goes on.","महीने भर मनी पेज की पट्टियाँ देखते रहें।","महिनाभर मनी पानावरील पट्ट्या तपासत रहा.")]},

 {id:"nospend",kind:"nospend",n:X("No-spend days","बिना खर्च वाले दिन","खर्चमुक्त दिवस"),
  one:X("Have days when you spend nothing on wants.","ऐसे दिन रखें जब इच्छाओं पर कुछ खर्च न हो।","असे दिवस ठेवा जेव्हा इच्छांवर काहीच खर्च होत नाही."),
  how:[X("Plan ahead: carry food and water.","पहले से तैयारी करें: खाना और पानी साथ रखें।","आधीच तयारी करा: जेवण आणि पाणी सोबत ठेवा."),X("Money Lab counts the days this month with no spending on wants.","मनी लैब इस महीने के वे दिन गिनता है जब इच्छाओं पर खर्च नहीं हुआ।","मनी लॅब या महिन्यातील इच्छांवर खर्च न झालेले दिवस मोजते."),X("Try to beat last month.","पिछले महीने से ज़्यादा दिन का लक्ष्य रखें।","मागच्या महिन्यापेक्षा जास्त दिवसांचे लक्ष्य ठेवा.")]},
 {id:"wait",kind:"wait",n:X("The 24-hour rule","24 घंटे का नियम","24 तासांचा नियम"),
  one:X("Before buying a want over ₹500, put it on your wait list for a day.","₹500 से ज़्यादा की कोई इच्छा खरीदने से पहले, उसे एक दिन के लिए वेटिंग लिस्ट में रखें।","₹500 पेक्षा जास्तची इच्छा विकत घेण्याआधी, ती एका दिवसासाठी प्रतीक्षा यादीत ठेवा."),

 {id:"track",kind:"track",n:X("Track every rupee for 30 days","30 दिन तक हर रुपया लिखें","30 दिवस प्रत्येक रुपया लिहा"),

 {id:"efirst",kind:"efirst",n:X("Emergency fund first","पहले आपातकालीन फ़ंड","आधी आपत्कालीन निधी"),

 {id:"low",kind:"low",n:X("Plan on your lowest month","सबसे कम आमदनी वाले महीने पर योजना","सर्वात कमी उत्पन्नाच्या महिन्यावर नियोजन"),

{id:"open-account",sec:"bank",kw:"bank account open savings documents aadhaar pan form 60 kyc branch minor",rel:["bsbd","debit","upi"],
 t:X("How to open a bank account","बैंक खाता कैसे खोलें","बँक खाते कसे उघडावे"),
 s:X("You need a bank account to get paid, receive scholarships and use UPI. Opening one is free.","वेतन पाने, स्कॉलरशिप लेने और UPI इस्तेमाल करने के लिए बैंक खाता चाहिए। खाता खोलना मुफ़्त है।","पगार मिळवण्यासाठी, शिष्यवृत्ती घेण्यासाठी आणि UPI वापरण्यासाठी बँक खाते लागते. खाते उघडणे मोफत आहे."),
 st:[X("Choose a bank branch near you. Any bank can open a basic savings account.","अपने पास की कोई बैंक शाखा चुनें। कोई भी बैंक बेसिक बचत खाता खोल सकता है।","जवळची एखादी बँक शाखा निवडा. कोणतीही बँक बेसिक बचत खाते उघडू शकते."),
  X("Carry your Aadhaar card, a passport-size photo and your PAN card. If you have no PAN, ask for Form 60.","आधार कार्ड, पासपोर्ट साइज़ फ़ोटो और पैन कार्ड साथ ले जाएँ। पैन नहीं है तो फ़ॉर्म 60 माँगें।","आधार कार्ड, पासपोर्ट आकाराचा फोटो आणि पॅन कार्ड सोबत न्या. पॅन नसेल तर फॉर्म 60 मागा."),
  X("Fill in the account opening form. Ask the staff about any word you do not understand.","खाता खोलने का फ़ॉर्म भरें। कोई शब्द समझ न आए तो स्टाफ़ से पूछें।","खाते उघडण्याचा फॉर्म भरा. एखादा शब्द कळला नाही तर कर्मचाऱ्यांना विचारा."),
  X("Give a mobile number only you use, so bank SMS alerts come to you.","ऐसा मोबाइल नंबर दें जो सिर्फ़ आप इस्तेमाल करते हों, ताकि बैंक के SMS आपको मिलें।","फक्त तुम्ही वापरता असा मोबाइल नंबर द्या, म्हणजे बँकेचे SMS तुम्हालाच येतील."),
  X("Ask if there is a minimum balance. If you cannot keep it, ask for a zero-balance (BSBD) account.","पूछें कि न्यूनतम बैलेंस रखना है या नहीं। अगर नहीं रख सकते, तो ज़ीरो-बैलेंस (BSBD) खाता माँगें।","किमान शिल्लक ठेवावी लागते का ते विचारा. ठेवू शकत नसाल तर झिरो-बॅलन्स (BSBD) खाते मागा.")],
 w:[X("RBI rules let students aged 10 and above open and run a savings account themselves, within limits the bank sets.","RBI के नियमों के अनुसार 10 साल और उससे बड़े विद्यार्थी, बैंक की तय सीमा के भीतर, खुद बचत खाता खोल और चला सकते हैं।","RBI च्या नियमांनुसार 10 वर्षे व त्याहून मोठे विद्यार्थी, बँकेने ठरवलेल्या मर्यादेत, स्वतः बचत खाते उघडू आणि चालवू शकतात."),
  X("At 18, the bank will ask you to update your signature and details.","18 साल होने पर बैंक आपसे हस्ताक्षर और जानकारी अपडेट करने को कहेगा।","18 वर्षांचे झाल्यावर बँक तुम्हाला सही आणि माहिती अपडेट करायला सांगेल."),
  X("Never pay an agent to open an account. It is free at the branch.","खाता खुलवाने के लिए किसी एजेंट को पैसे न दें। शाखा में यह मुफ़्त है।","खाते उघडण्यासाठी कोणत्याही एजंटला पैसे देऊ नका. शाखेत हे मोफत आहे.")]},
{id:"bsbd",sec:"bank",kw:"zero balance bsbd minimum balance charges fine basic account jan dhan",rel:["open-account","statement"],case:"c4",
 t:X("Zero-balance accounts (BSBD)","ज़ीरो-बैलेंस खाता (BSBD)","झिरो-बॅलन्स खाते (BSBD)"),
 s:X("A Basic Savings Bank Deposit account needs no minimum balance, so you are never charged for having little money in it.","बेसिक सेविंग्स बैंक डिपॉज़िट खाते में न्यूनतम बैलेंस नहीं रखना पड़ता, इसलिए कम पैसे होने पर कोई चार्ज नहीं लगता।","बेसिक सेव्हिंग्ज बँक डिपॉझिट खात्यात किमान शिल्लक ठेवावी लागत नाही, त्यामुळे कमी पैसे असल्यास कोणताही दंड लागत नाही."),
