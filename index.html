{id:"debit",sec:"bank",kw:"debit card atm pin withdraw cash card lost blocked stuck machine",rel:["fraud","statement"],
 t:X("Debit cards, ATMs and PINs","डेबिट कार्ड, ATM और PIN","डेबिट कार्ड, ATM आणि PIN"),
 s:X("Your debit card takes money straight from your account. The PIN is the key, so keep it only in your head.","डेबिट कार्ड सीधे आपके खाते से पैसे लेता है। PIN उसकी चाबी है, इसलिए उसे सिर्फ़ याद रखें।","डेबिट कार्ड थेट तुमच्या खात्यातून पैसे घेते. PIN ही त्याची चावी आहे, म्हणून ती फक्त लक्षात ठेवा."),
 st:[X("Set a PIN that is not your birth year or 1234.","ऐसा PIN रखें जो आपका जन्म-वर्ष या 1234 न हो।","तुमचे जन्मवर्ष किंवा 1234 नसलेला PIN ठेवा."),
  X("Cover the keypad with your hand when you type the PIN.","PIN डालते समय हाथ से कीपैड ढकें।","PIN टाकताना हाताने कीपॅड झाका."),
  X("Never take help from a stranger at an ATM. If the card gets stuck, call the bank from where you are.","ATM पर कभी अजनबी की मदद न लें। कार्ड फँस जाए तो वहीं से बैंक को फ़ोन करें।","ATM वर कधीही अनोळखी व्यक्तीची मदत घेऊ नका. कार्ड अडकले तर तिथूनच बँकेला फोन करा."),
  X("If the card is lost, block it at once: call the number in your passbook or use the bank app.","कार्ड खो जाए तो तुरंत ब्लॉक करें: पासबुक में लिखे नंबर पर फ़ोन करें या बैंक ऐप इस्तेमाल करें।","कार्ड हरवले तर लगेच ब्लॉक करा: पासबुकमधील नंबरवर फोन करा किंवा बँक ॲप वापरा.")],
 w:[X("Count your cash at the machine and keep the slip until you have checked your balance.","पैसे मशीन पर ही गिनें और बैलेंस जाँचने तक पर्ची रखें।","पैसे मशीनजवळच मोजा आणि शिल्लक तपासेपर्यंत पावती ठेवा.")]},
{id:"upi",sec:"bank",kw:"upi pin gpay phonepe paytm bhim qr code scan collect request send receive money transfer",rel:["codes","fraud"],
 t:X("Using UPI safely","UPI सुरक्षित तरीके से इस्तेमाल करें","UPI सुरक्षितपणे वापरा"),
 s:X("UPI moves money instantly from your bank account. Your UPI PIN is only for sending money, never for receiving it.","UPI आपके बैंक खाते से तुरंत पैसे भेजता है। UPI PIN सिर्फ़ पैसे भेजने के लिए है, पाने के लिए कभी नहीं।","UPI तुमच्या बँक खात्यातून लगेच पैसे पाठवते. UPI PIN फक्त पैसे पाठवण्यासाठी असतो, घेण्यासाठी कधीच नाही."),
 st:[X("Install a UPI app from the official app store and link the bank account registered to your mobile number.","आधिकारिक ऐप स्टोर से UPI ऐप डाउनलोड करें और अपने मोबाइल नंबर से जुड़ा बैंक खाता जोड़ें।","अधिकृत ॲप स्टोअरमधून UPI ॲप घ्या आणि तुमच्या मोबाइल नंबरशी जोडलेले बँक खाते जोडा."),
  X("Set a UPI PIN using your debit card details. Do not share it with anyone.","डेबिट कार्ड की जानकारी से UPI PIN बनाएँ। इसे किसी को न बताएँ।","डेबिट कार्डच्या माहितीने UPI PIN तयार करा. तो कोणालाही सांगू नका."),
  X("Before paying, check that the name on screen matches the person or shop.","भुगतान से पहले देखें कि स्क्रीन पर दिख रहा नाम उसी व्यक्ति या दुकान का है।","पैसे देण्याआधी स्क्रीनवरील नाव त्याच व्यक्तीचे किंवा दुकानाचे आहे का ते तपासा."),
  X("To receive money, you only share your UPI ID or QR code. You never scan, approve or enter a PIN.","पैसे पाने के लिए सिर्फ़ अपना UPI ID या QR कोड दें। आपको न कुछ स्कैन करना है, न मंज़ूर करना है, न PIN डालना है।","पैसे घेण्यासाठी फक्त तुमचा UPI ID किंवा QR कोड द्या. काहीही स्कॅन, मंजूर किंवा PIN टाकावा लागत नाही.")],
 w:[X("A “collect request” asks you to pay. Decline any you did not expect.","“कलेक्ट रिक्वेस्ट” आपसे पैसे माँगती है। जो अचानक आए, उसे मना करें।","“कलेक्ट रिक्वेस्ट” म्हणजे तुमच्याकडून पैसे मागणे. अनपेक्षित आलेली नाकारा."),
  X("Scanning a QR code sends money. Nobody needs you to scan a code to pay you.","QR कोड स्कैन करने से पैसे जाते हैं। आपको पैसे देने के लिए किसी को आपसे स्कैन कराने की ज़रूरत नहीं।","QR कोड स्कॅन केल्याने पैसे जातात. तुम्हाला पैसे देण्यासाठी कोणालाही तुमच्याकडून स्कॅन करून घ्यावे लागत नाही.")]},
{id:"statement",sec:"bank",kw:"sms credited debited balance avl bal statement passbook charges check",rel:["fraud","bsbd"],
 t:X("Reading bank SMS and statements","बैंक SMS और स्टेटमेंट पढ़ना","बँक SMS आणि स्टेटमेंट वाचणे"),
 s:X("Every bank SMS tells you that money came in or went out. Reading them takes seconds and catches problems early.","हर बैंक SMS बताता है कि पैसा आया या गया। इन्हें पढ़ने में कुछ सेकंड लगते हैं और गड़बड़ जल्दी पकड़ में आती है।","प्रत्येक बँक SMS सांगतो की पैसे आले की गेले. ते वाचायला काही सेकंद लागतात आणि गडबड लवकर लक्षात येते."),
 st:[X("“Credited” means money came in. “Debited” means money went out.","“Credited” यानी पैसा आया। “Debited” यानी पैसा गया।","“Credited” म्हणजे पैसे आले. “Debited” म्हणजे पैसे गेले."),
  X("“Avl bal” is how much is in your account now.","“Avl bal” यानी अभी खाते में कितना है।","“Avl bal” म्हणजे आत्ता खात्यात किती आहे."),
  X("Once a month, compare your statement in the bank app or passbook with what you spent.","महीने में एक बार बैंक ऐप या पासबुक का स्टेटमेंट अपने खर्च से मिलाएँ।","महिन्यातून एकदा बँक ॲप किंवा पासबुकमधील स्टेटमेंट तुमच्या खर्चाशी जुळवा."),
  X("Look for small charges you did not expect, like SMS fees or low-balance charges.","छोटे अनजाने चार्ज देखें, जैसे SMS फ़ीस या कम बैलेंस का चार्ज।","अनपेक्षित छोटे शुल्क पहा, जसे SMS फी किंवा कमी शिलकीचा दंड.")],
 w:[X("A debit you did not make: act the same day. See “Money left my account”.","ऐसा डेबिट जो आपने नहीं किया: उसी दिन कदम उठाएँ। “खाते से पैसे कट गए” देखें।","तुम्ही न केलेले डेबिट: त्याच दिवशी पावले उचला. “खात्यातून पैसे गेले” पहा.")]},
{id:"payslip",sec:"earn",kw:"salary payslip pay slip gross net pf provident fund deductions first job wages",rel:["pan","tax","budget"],case:"c1",
 t:X("Your first pay slip","आपकी पहली सैलरी स्लिप","तुमची पहिली पगार स्लिप"),
 s:X("Your pay slip shows what you earned, what was taken out and what you actually received. Plan with what you received.","सैलरी स्लिप दिखाती है कि आपने कितना कमाया, कितना कटा और असल में कितना मिला। जो मिला, उसी से योजना बनाएँ।","पगार स्लिप दाखवते की तुम्ही किती कमावले, किती कापले गेले आणि प्रत्यक्ष किती मिळाले. जे मिळाले त्यावरूनच नियोजन करा."),
 st:[X("Gross pay is the total you earned. Net pay is what reaches your account.","ग्रॉस पे यानी कुल कमाई। नेट पे यानी जो खाते में आता है।","ग्रॉस पे म्हणजे एकूण कमाई. नेट पे म्हणजे खात्यात येणारी रक्कम."),
  X("PF (provident fund) is savings for your future. Your employer adds to it too.","PF (प्रोविडेंट फ़ंड) आपके भविष्य के लिए बचत है। इसमें नियोक्ता भी पैसे जोड़ता है।","PF (प्रॉव्हिडंट फंड) ही तुमच्या भविष्यासाठी बचत आहे. यात मालकही पैसे जोडतो."),
  X("Keep every pay slip. You may need them for loans, renting and tax.","हर सैलरी स्लिप रखें। लोन, किराए और टैक्स के लिए इनकी ज़रूरत पड़ सकती है।","प्रत्येक पगार स्लिप ठेवा. कर्ज, भाडे आणि करासाठी त्या लागू शकतात."),
  X("If you are paid in cash with no slip, ask for a written record each month.","अगर नकद वेतन मिलता है और स्लिप नहीं, तो हर महीने लिखित रिकॉर्ड माँगें।","रोख पगार मिळत असेल आणि स्लिप नसेल, तर दरमहा लेखी नोंद मागा.")],
 w:[X("A job that never gives any written record of pay makes it harder to prove your income later.","जो नौकरी वेतन का कोई लिखित रिकॉर्ड नहीं देती, उससे बाद में आमदनी साबित करना मुश्किल होता है।","जी नोकरी पगाराची कोणतीही लेखी नोंद देत नाही, त्यामुळे नंतर उत्पन्न सिद्ध करणे कठीण होते.")]},
{id:"pan",sec:"earn",kw:"pan card tax number e-pan apply aadhaar income tax",rel:["tax","open-account"],
 t:X("Getting a PAN card","पैन कार्ड बनवाना","पॅन कार्ड काढणे"),
 s:X("PAN is your permanent tax number. You need it for jobs, larger bank deposits and filing tax.","पैन आपका स्थायी टैक्स नंबर है। नौकरी, बड़ी बैंक जमा और टैक्स भरने के लिए इसकी ज़रूरत होती है।","पॅन हा तुमचा कायमचा कर क्रमांक आहे. नोकरी, मोठ्या बँक ठेवी आणि कर भरण्यासाठी तो लागतो."),
 st:[X("Apply for a free instant e-PAN with your Aadhaar on the Income Tax website, incometax.gov.in.","आयकर वेबसाइट incometax.gov.in पर आधार से मुफ़्त तुरंत ई-पैन बनाएँ।","आयकर वेबसाइट incometax.gov.in वर आधार वापरून मोफत झटपट ई-पॅन मिळवा."),
  X("Your Aadhaar must be linked to your mobile number to get the OTP.","OTP पाने के लिए आपका आधार मोबाइल नंबर से जुड़ा होना चाहिए।","OTP मिळवण्यासाठी तुमचे आधार मोबाइल नंबरशी जोडलेले असावे."),
  X("Keep your PAN safe. Share it only with your bank, employer or college.","पैन सुरक्षित रखें। सिर्फ़ बैंक, नियोक्ता या कॉलेज को दें।","पॅन सुरक्षित ठेवा. फक्त बँक, मालक किंवा कॉलेजला द्या.")],
 w:[X("Do not pay an agent for something you can do free online.","जो काम ऑनलाइन मुफ़्त हो सकता है, उसके लिए एजेंट को पैसे न दें।","जे काम ऑनलाइन मोफत होते, त्यासाठी एजंटला पैसे देऊ नका."),
  X("One person can have only one PAN.","एक व्यक्ति के पास सिर्फ़ एक पैन हो सकता है।","एका व्यक्तीकडे फक्त एकच पॅन असू शकतो.")]},
{id:"tax",sec:"earn",kw:"income tax tds itr return refund form 16 salary tax file",rel:["pan","payslip"],
 t:X("Do I need to pay income tax?","क्या मुझे इनकम टैक्स देना होगा?","मला आयकर भरावा लागेल का?"),
 s:X("Income tax depends on what you earn in a year. Most students and first jobs earn below the level where tax is due, but the rules can change every year.","इनकम टैक्स आपकी सालाना कमाई पर निर्भर करता है। ज़्यादातर विद्यार्थी और पहली नौकरी वाले उस सीमा से कम कमाते हैं जिस पर टैक्स लगता है, लेकिन नियम हर साल बदल सकते हैं।","आयकर तुमच्या वार्षिक कमाईवर अवलंबून असतो. बहुतेक विद्यार्थी आणि पहिल्या नोकरीतील लोक कर लागणाऱ्या मर्यादेपेक्षा कमी कमावतात, पण नियम दरवर्षी बदलू शकतात."),
 st:[X("If your employer cuts tax from your pay (TDS) but your yearly income is low, you can get it back by filing a return on incometax.gov.in.","अगर नियोक्ता वेतन से टैक्स (TDS) काटता है लेकिन आपकी सालाना आमदनी कम है, तो incometax.gov.in पर रिटर्न भरकर उसे वापस पा सकते हैं।","मालक पगारातून कर (TDS) कापत असेल पण तुमचे वार्षिक उत्पन्न कमी असेल, तर incometax.gov.in वर रिटर्न भरून तो परत मिळवू शकता."),
  X("Keep your pay slips, and Form 16 if your employer gives one.","अपनी सैलरी स्लिप, और फ़ॉर्म 16 अगर नियोक्ता दे, संभालकर रखें।","पगार स्लिप, आणि मालकाने दिल्यास फॉर्म 16, जपून ठेवा."),
  X("Ask a trusted adult, a teacher or the free help on the tax website before you pay anyone.","किसी को पैसे देने से पहले भरोसेमंद बड़े, शिक्षक या टैक्स वेबसाइट की मुफ़्त मदद लें।","कोणाला पैसे देण्याआधी विश्वासू मोठ्या व्यक्तीची, शिक्षकांची किंवा कर वेबसाइटवरील मोफत मदत घ्या.")],
 w:[X("Calls or messages about a “tax refund” that ask for your bank details are scams.","“टैक्स रिफ़ंड” के नाम पर बैंक जानकारी माँगने वाले कॉल या मैसेज धोखा हैं।","“टॅक्स रिफंड” च्या नावाने बँक माहिती मागणारे कॉल किंवा मेसेज फसवणूक आहेत.")]},
{id:"budget",sec:"save",kw:"budget plan monthly expenses needs wants save money runs out irregular income",rel:["emergency","goals","payslip"],case:"c1",
 t:X("Making a monthly budget","महीने का बजट बनाना","महिन्याचे बजेट बनवणे"),
 s:X("A budget is a plan for your money before the month starts. It works best when savings come first.","बजट महीना शुरू होने से पहले पैसों की योजना है। यह तब सबसे अच्छा काम करता है जब बचत पहले हो।","बजेट म्हणजे महिना सुरू होण्याआधी पैशांचे नियोजन. बचत आधी केली तर ते सर्वात चांगले चालते."),
 st:[X("Write down all the money coming in this month.","इस महीने आने वाला सारा पैसा लिखें।","या महिन्यात येणारे सर्व पैसे लिहा."),
  X("Take out savings first, even ₹100.","पहले बचत अलग करें, चाहे ₹100 ही हो।","आधी बचत बाजूला करा, अगदी ₹100 तरी."),
  X("Then pay for needs: rent, food, travel, phone and study.","फिर ज़रूरतें: किराया, खाना, आना-जाना, फ़ोन और पढ़ाई।","मग गरजा: भाडे, जेवण, प्रवास, फोन आणि अभ्यास."),
  X("What is left is for wants. Divide it by the weeks left.","जो बचे, वह इच्छाओं के लिए है। उसे बचे हफ़्तों में बाँटें।","जे उरेल ते इच्छांसाठी. ते उरलेल्या आठवड्यांत वाटा."),
  X("If your income changes month to month, plan on your lowest month.","अगर आमदनी हर महीने बदलती है, तो सबसे कम वाले महीने पर योजना बनाएँ।","उत्पन्न दरमहा बदलत असेल, तर सर्वात कमी उत्पन्नाच्या महिन्यावर नियोजन करा.")],
 w:[X("If money runs out before the month ends more than once, cut wants first, not savings.","अगर बार-बार महीने से पहले पैसा खत्म हो, तो पहले इच्छाएँ कम करें, बचत नहीं।","वारंवार महिना संपण्याआधी पैसे संपत असतील, तर आधी इच्छा कमी करा, बचत नाही.")]},
{id:"emergency",sec:"save",kw:"emergency fund savings urgent illness medical hospital sudden expense",rel:["where-save","insurance","budget"],case:"c9",
 t:X("Building an emergency fund","आपातकालीन फ़ंड बनाना","आपत्कालीन निधी तयार करणे"),
 s:X("An emergency fund is money kept only for things that are urgent and unplanned, so one bad week does not become debt.","आपातकालीन फ़ंड वह पैसा है जो सिर्फ़ अचानक और ज़रूरी चीज़ों के लिए रखा जाता है, ताकि एक बुरा हफ़्ता कर्ज़ न बन जाए।","आपत्कालीन निधी म्हणजे फक्त अचानक आणि तातडीच्या गोष्टींसाठी ठेवलेले पैसे, म्हणजे एक वाईट आठवडा कर्ज बनत नाही."),
 st:[X("Start with ₹1,000. Then aim for one month of your usual costs.","₹1,000 से शुरू करें। फिर एक महीने के सामान्य खर्च का लक्ष्य रखें।","₹1,000 पासून सुरुवात करा. मग एका महिन्याच्या नेहमीच्या खर्चाचे लक्ष्य ठेवा."),
  X("Keep it separate from spending money, for example in a recurring deposit.","इसे खर्च वाले पैसों से अलग रखें, जैसे रेकरिंग डिपॉज़िट में।","ते खर्चाच्या पैशांपासून वेगळे ठेवा, उदा. आवर्ती ठेवीत (RD)."),
  X("Before using it, ask: is it urgent, and did I not see it coming?","इस्तेमाल से पहले पूछें: क्या यह ज़रूरी है, और क्या यह अचानक आया?","वापरण्याआधी विचारा: हे तातडीचे आहे का, आणि अचानक आले का?"),
  X("After using it, refill it before saving for anything else.","इस्तेमाल के बाद किसी और चीज़ के लिए बचाने से पहले इसे दोबारा भरें।","वापरल्यानंतर इतर कशासाठी बचत करण्याआधी तो पुन्हा भरा.")],
 w:[X("A sale or a trip is not an emergency.","सेल या घूमना आपात स्थिति नहीं है।","सेल किंवा सहल ही आपत्कालीन परिस्थिती नाही.")]},
{id:"where-save",sec:"save",kw:"savings account recurring deposit rd fixed deposit fd post office interest invest investment mutual fund sip shares stock",rel:["emergency","goals","jobscams"],
 t:X("Where to keep your savings","बचत कहाँ रखें","बचत कुठे ठेवावी"),
 s:X("Keep savings somewhere safe, separate from spending money, where they earn a little interest. Avoid anything that promises fast, high returns.","बचत ऐसी जगह रखें जहाँ वह सुरक्षित हो, खर्च के पैसों से अलग हो और थोड़ा ब्याज मिले। जल्दी और ज़्यादा कमाई का वादा करने वाली चीज़ों से बचें।","बचत सुरक्षित ठिकाणी, खर्चाच्या पैशांपासून वेगळी आणि थोडे व्याज मिळेल अशी ठेवा. लवकर आणि जास्त परताव्याचे आमिष टाळा."),
 st:[X("Savings account: easy to use, low interest. Good for spending money.","बचत खाता: इस्तेमाल में आसान, ब्याज कम। खर्च के पैसों के लिए ठीक।","बचत खाते: वापरायला सोपे, व्याज कमी. खर्चाच्या पैशांसाठी योग्य."),
  X("Recurring deposit (RD): pay in a fixed amount every month, like ₹200, for a set time. Good for building a habit.","रेकरिंग डिपॉज़िट (RD): हर महीने तय रकम, जैसे ₹200, एक तय समय तक जमा करें। आदत बनाने के लिए अच्छा।","आवर्ती ठेव (RD): दरमहा ठरलेली रक्कम, उदा. ₹200, ठरलेल्या काळासाठी जमा करा. सवय लावण्यासाठी चांगले."),
  X("Fixed deposit (FD): put in a lump sum for a fixed time and earn more interest than a savings account.","फ़िक्स्ड डिपॉज़िट (FD): एकमुश्त रकम तय समय के लिए जमा करें, बचत खाते से ज़्यादा ब्याज मिलता है।","मुदत ठेव (FD): एकरकमी रक्कम ठरलेल्या काळासाठी जमा करा, बचत खात्यापेक्षा जास्त व्याज मिळते."),
  X("Post office savings schemes are also safe and found in most towns.","पोस्ट ऑफ़िस बचत योजनाएँ भी सुरक्षित हैं और ज़्यादातर शहरों में मिलती हैं।","पोस्ट ऑफिस बचत योजनाही सुरक्षित आहेत आणि बहुतेक गावांत उपलब्ध आहेत.")],
 w:[X("Cash at home can be lost, stolen or spent.","घर पर रखा नकद पैसा खो सकता है, चोरी हो सकता है या खर्च हो सकता है।","घरी ठेवलेले रोख पैसे हरवू शकतात, चोरीला जाऊ शकतात किंवा खर्च होऊ शकतात."),
  X("Shares and mutual funds can grow money over many years, but they can also fall. Learn first, and never invest money you will need soon.","शेयर और म्यूचुअल फ़ंड लंबे समय में पैसा बढ़ा सकते हैं, पर घट भी सकते हैं। पहले सीखें, और जो पैसा जल्दी चाहिए उसे कभी न लगाएँ।","शेअर्स आणि म्युच्युअल फंड अनेक वर्षांत पैसे वाढवू शकतात, पण कमीही होऊ शकतात. आधी शिका, आणि लवकर लागणारे पैसे कधीही गुंतवू नका.")]},
{id:"goals",sec:"save",kw:"goal save saving for phone laptop course trip target weekly",rel:["emergency","bnpl"],case:"c5",
 t:X("Saving for something you want","किसी चाहत के लिए बचत करना","हव्या असलेल्या गोष्टीसाठी बचत करणे"),
 s:X("Saving for a phone, a course or a trip is easier when you know the price, the date and how much to put aside each week.","फ़ोन, कोर्स या यात्रा के लिए बचत तब आसान होती है जब आपको कीमत, तारीख और हर हफ़्ते की रकम पता हो।","फोन, कोर्स किंवा सहलीसाठी बचत तेव्हा सोपी होते जेव्हा किंमत, तारीख आणि दर आठवड्याची रक्कम माहीत असते."),
 st:[X("Write down the goal and its price.","लक्ष्य और उसकी कीमत लिखें।","लक्ष्य आणि त्याची किंमत लिहा."),
  X("Divide the price by the number of weeks until you need it. That is your weekly saving.","कीमत को उतने हफ़्तों से भाग दें जब तक आपको उसकी ज़रूरत है। यही हर हफ़्ते की बचत है।","किंमतीला गरज असेपर्यंतच्या आठवड्यांनी भागा. हीच दर आठवड्याची बचत."),
  X("Add a goal in Money and add to it each time you save.","मनी में लक्ष्य जोड़ें और हर बार बचत करने पर उसमें जोड़ें।","मनी मध्ये लक्ष्य जोडा आणि प्रत्येक वेळी बचत केल्यावर त्यात भर घाला."),
  X("Compare saving first with an EMI. Saving first often costs less in total.","पहले बचत की तुलना EMI से करें। पहले बचत करना अक्सर कुल मिलाकर सस्ता पड़ता है।","आधी बचतीची EMI शी तुलना करा. आधी बचत करणे बहुधा एकूण स्वस्त पडते.")],
 w:[X("Build your emergency fund before saving for big wants.","बड़ी इच्छाओं के लिए बचाने से पहले आपातकालीन फ़ंड बनाएँ।","मोठ्या इच्छांसाठी बचत करण्याआधी आपत्कालीन निधी तयार करा.")]},
{id:"borrow",sec:"borrow",kw:"loan borrow interest emi total cost guarantor lender moneylender",rel:["credit","bnpl","loanapps"],case:"c8",
 t:X("Before you borrow","उधार लेने से पहले","उधार घेण्याआधी"),
 s:X("Every loan has a cost. Look at the total you will repay, not the monthly amount.","हर कर्ज़ की एक कीमत होती है। मासिक किस्त नहीं, कुल चुकाई जाने वाली रकम देखें।","प्रत्येक कर्जाची किंमत असते. मासिक हप्ता नाही, एकूण परतफेडीची रक्कम पहा."),
 st:[X("First ask the place you owe (college, landlord, hospital) if you can pay in parts.","पहले जिसे पैसे देने हैं (कॉलेज, मकान मालिक, अस्पताल), उससे पूछें कि क्या किस्तों में दे सकते हैं।","आधी ज्याला पैसे द्यायचे (कॉलेज, घरमालक, रुग्णालय) त्याला हप्त्यांत देता येईल का ते विचारा."),
  X("Work out the total: monthly amount × number of months + every fee.","कुल रकम निकालें: मासिक किस्त × महीनों की संख्या + हर फ़ीस।","एकूण रक्कम काढा: मासिक हप्ता × महिन्यांची संख्या + प्रत्येक फी."),
  X("Borrow from a bank or a lender registered with the RBI, not an unknown app or person.","बैंक या RBI में पंजीकृत कर्ज़दाता से लें, किसी अनजान ऐप या व्यक्ति से नहीं।","बँक किंवा RBI कडे नोंदणीकृत कर्जदात्याकडून घ्या, अनोळखी ॲप किंवा व्यक्तीकडून नाही."),
  X("Only borrow what you can repay from income you are sure of.","उतना ही लें जितना पक्की आमदनी से चुका सकें।","खात्रीच्या उत्पन्नातून फेडू शकाल तेवढेच घ्या.")],
 w:[X("Never borrow to repay another loan.","दूसरा कर्ज़ चुकाने के लिए कभी कर्ज़ न लें।","दुसरे कर्ज फेडण्यासाठी कधीही कर्ज घेऊ नका."),
  X("Signing as a guarantor means you may have to repay someone else's loan.","गारंटर बनने का मतलब है कि आपको किसी और का कर्ज़ चुकाना पड़ सकता है।","जामीनदार होणे म्हणजे तुम्हाला दुसऱ्याचे कर्ज फेडावे लागू शकते.")]},
{id:"credit",sec:"borrow",kw:"credit score cibil report emi late payment record 300 900",rel:["borrow","bnpl"],
 t:X("Your credit score","आपका क्रेडिट स्कोर","तुमचा क्रेडिट स्कोअर"),
 s:X("A credit score is a number, usually from 300 to 900, that shows lenders how well you repay. A higher score makes future loans easier and cheaper.","क्रेडिट स्कोर एक संख्या है, आमतौर पर 300 से 900 तक, जो कर्ज़दाताओं को बताती है कि आप कितनी अच्छी तरह चुकाते हैं। ऊँचा स्कोर भविष्य के कर्ज़ आसान और सस्ते बनाता है।","क्रेडिट स्कोअर हा एक आकडा आहे, सहसा 300 ते 900, जो कर्जदात्यांना दाखवतो की तुम्ही किती व्यवस्थित परतफेड करता. जास्त स्कोअरमुळे भविष्यातील कर्ज सोपे आणि स्वस्त होते."),
 st:[X("Pay every EMI and credit card bill on time, even small ones like a phone EMI.","हर EMI और क्रेडिट कार्ड बिल समय पर चुकाएँ, फ़ोन की छोटी EMI भी।","प्रत्येक EMI आणि क्रेडिट कार्ड बिल वेळेवर भरा, फोनची छोटी EMI सुद्धा."),
  X("If you cannot pay, talk to the lender before the due date, not after.","अगर नहीं चुका सकते, तो तारीख से पहले कर्ज़दाता से बात करें, बाद में नहीं।","भरू शकत नसाल तर देय तारखेआधी कर्जदात्याशी बोला, नंतर नाही."),
  X("You can get a free credit report once a year from each credit bureau.","आप हर क्रेडिट ब्यूरो से साल में एक बार मुफ़्त क्रेडिट रिपोर्ट ले सकते हैं।","प्रत्येक क्रेडिट ब्युरोकडून वर्षातून एकदा मोफत क्रेडिट अहवाल मिळवता येतो.")],
 w:[X("Missed payments can stay on your record for years.","चूकी हुई किस्तें सालों तक रिकॉर्ड में रह सकती हैं।","चुकलेले हप्ते अनेक वर्षे नोंदीत राहू शकतात."),
  X("Anyone offering to “fix” your score for a fee is likely a scam.","जो फ़ीस लेकर स्कोर “ठीक” करने की बात करे, वह शायद धोखा है।","फी घेऊन स्कोअर “दुरुस्त” करण्याची ऑफर देणारा बहुधा फसवणूक करतो.")]},
{id:"bnpl",sec:"borrow",kw:"pay later bnpl emi no cost emi credit card minimum due interest processing fee phone",rel:["credit","goals"],case:"c5",
 t:X("“Pay later”, EMIs and credit cards","“पे लेटर”, EMI और क्रेडिट कार्ड","“पे लेटर”, EMI आणि क्रेडिट कार्ड"),
 s:X("Pay later, no-cost EMI and credit cards are all borrowing. Each payment feels small, but they add up.","पे लेटर, नो-कॉस्ट EMI और क्रेडिट कार्ड, सब उधार ही हैं। हर किस्त छोटी लगती है, पर जुड़ती जाती है।","पे लेटर, नो-कॉस्ट EMI आणि क्रेडिट कार्ड, हे सर्व उधारच आहे. प्रत्येक हप्ता छोटा वाटतो, पण वाढत जातो."),
 st:[X("Add up every payment plus any processing fee, and compare it with the cash price.","हर किस्त और प्रोसेसिंग फ़ीस जोड़ें, और नकद कीमत से तुलना करें।","प्रत्येक हप्ता आणि प्रोसेसिंग फी जोडा, आणि रोख किमतीशी तुलना करा."),
  X("With a credit card, pay the full bill every month. Paying only the “minimum due” leads to high interest.","क्रेडिट कार्ड का पूरा बिल हर महीने भरें। सिर्फ़ “मिनिमम ड्यू” भरने पर भारी ब्याज लगता है।","क्रेडिट कार्डचे पूर्ण बिल दरमहा भरा. फक्त “मिनिमम ड्यू” भरल्यास मोठे व्याज लागते."),
  X("Note every EMI and its date, and add it as a need in your budget.","हर EMI और उसकी तारीख लिखें, और उसे बजट में ज़रूरत की तरह रखें।","प्रत्येक EMI आणि तिची तारीख लिहा, आणि ती बजेटमध्ये गरज म्हणून ठेवा.")],
 w:[X("Do not use pay later for things you do not need yet.","जिन चीज़ों की अभी ज़रूरत नहीं, उनके लिए पे लेटर न लें।","ज्या गोष्टींची अजून गरज नाही त्यासाठी पे लेटर वापरू नका.")]},
{id:"edu",sec:"borrow",kw:"scholarship education loan college fees nsp mahadbt vidyalaxmi fee waiver instalment exam fee",rel:["borrow"],case:"c10",
 t:X("Paying for college: scholarships and loans","कॉलेज का खर्च: स्कॉलरशिप और लोन","कॉलेजचा खर्च: शिष्यवृत्ती आणि कर्ज"),
 s:X("Look first for money you do not have to repay, then for low-cost education loans.","पहले ऐसा पैसा खोजें जो लौटाना न पड़े, फिर कम लागत वाले एजुकेशन लोन।","आधी परत न करावे लागणारे पैसे शोधा, मग कमी खर्चाचे शैक्षणिक कर्ज."),
 st:[X("Check the National Scholarship Portal (scholarships.gov.in) and your state's portal (in Maharashtra, MahaDBT) every year.","हर साल नेशनल स्कॉलरशिप पोर्टल (scholarships.gov.in) और अपने राज्य का पोर्टल (महाराष्ट्र में MahaDBT) देखें।","दरवर्षी नॅशनल स्कॉलरशिप पोर्टल (scholarships.gov.in) आणि तुमच्या राज्याचे पोर्टल (महाराष्ट्रात MahaDBT) पहा."),
  X("Ask your college about paying fees in parts and about fee waivers.","अपने कॉलेज से किस्तों में फ़ीस भरने और फ़ीस माफ़ी के बारे में पूछें।","तुमच्या कॉलेजकडे हप्त्यांत फी भरण्याबद्दल आणि फी माफीबद्दल विचारा."),
  X("For an education loan, compare banks on the government's PM-Vidyalaxmi portal.","एजुकेशन लोन के लिए सरकार के PM-विद्यालक्ष्मी पोर्टल पर बैंकों की तुलना करें।","शैक्षणिक कर्जासाठी सरकारच्या PM-विद्यालक्ष्मी पोर्टलवर बँकांची तुलना करा."),
  X("Keep your marksheets, income certificate and Aadhaar ready.","अपनी मार्कशीट, आय प्रमाण पत्र और आधार तैयार रखें।","गुणपत्रिका, उत्पन्नाचा दाखला आणि आधार तयार ठेवा.")],
 w:[X("Real scholarships never ask you to pay a fee to receive them.","असली स्कॉलरशिप पाने के लिए कभी फ़ीस नहीं माँगी जाती।","खरी शिष्यवृत्ती मिळवण्यासाठी कधीच फी मागितली जात नाही.")]},
{id:"insurance",sec:"safe",kw:"insurance health life accident pmsby pmjjby premium cover policy hospital",rel:["emergency"],
 t:X("Insurance basics","बीमा की बुनियादी बातें","विम्याची मूलभूत माहिती"),
 s:X("Insurance is a small, regular payment that protects you from a big loss. It is not wasted if nothing happens.","बीमा एक छोटा, नियमित भुगतान है जो बड़े नुकसान से बचाता है। कुछ न हो, तब भी वह बेकार नहीं जाता।","विमा म्हणजे मोठ्या नुकसानीपासून वाचवणारे छोटे, नियमित पेमेंट. काही झाले नाही तरी ते वाया जात नाही."),
 st:[X("Health insurance pays hospital bills. Check whether your family is covered by a government health scheme.","स्वास्थ्य बीमा अस्पताल के बिल चुकाता है। देखें कि क्या आपका परिवार किसी सरकारी स्वास्थ्य योजना में शामिल है।","आरोग्य विमा रुग्णालयाची बिले भरतो. तुमचे कुटुंब एखाद्या सरकारी आरोग्य योजनेत आहे का ते तपासा."),
  X("PMSBY (from age 18): about ₹20 a year for ₹2 lakh of accident cover, through your bank.","PMSBY (18 साल से): बैंक के ज़रिए लगभग ₹20 सालाना में ₹2 लाख का दुर्घटना बीमा।","PMSBY (18 वर्षांपासून): बँकेमार्फत वर्षाला सुमारे ₹20 मध्ये ₹2 लाखांचा अपघात विमा."),
  X("PMJJBY (age 18 to 50): ₹436 a year for ₹2 lakh of life cover, through your bank.","PMJJBY (18 से 50 साल): बैंक के ज़रिए ₹436 सालाना में ₹2 लाख का जीवन बीमा।","PMJJBY (18 ते 50 वर्षे): बँकेमार्फत वर्षाला ₹436 मध्ये ₹2 लाखांचा जीवन विमा."),
  X("Before buying any policy, read what it does not cover.","कोई भी पॉलिसी लेने से पहले पढ़ें कि उसमें क्या शामिल नहीं है।","कोणतीही पॉलिसी घेण्याआधी तिच्यात काय समाविष्ट नाही ते वाचा.")],
 w:[X("Insurance is for protection, not for growing money. Be careful with policies sold as investments.","बीमा सुरक्षा के लिए है, पैसा बढ़ाने के लिए नहीं। निवेश के नाम पर बेची जाने वाली पॉलिसियों से सावधान रहें।","विमा संरक्षणासाठी आहे, पैसे वाढवण्यासाठी नाही. गुंतवणूक म्हणून विकल्या जाणाऱ्या पॉलिसींपासून सावध रहा.")]},
{id:"codes",sec:"safe",kw:"otp pin password call message kyc link fraud bank call digital arrest police scam phishing",rel:["fraud","upi"],case:"c3",
 t:X("Calls and messages asking for codes","कोड माँगने वाले कॉल और मैसेज","कोड मागणारे कॉल आणि मेसेज"),
 s:X("Nobody real will ever ask for your OTP, PIN or password: not your bank, not the police, not a delivery company.","कोई असली व्यक्ति कभी आपका OTP, PIN या पासवर्ड नहीं माँगेगा: न बैंक, न पुलिस, न डिलीवरी कंपनी।","कोणतीही खरी व्यक्ती कधीच तुमचा OTP, PIN किंवा पासवर्ड मागणार नाही: ना बँक, ना पोलीस, ना डिलिव्हरी कंपनी."),
 st:[X("Hang up or stop replying.","फ़ोन काट दें या जवाब देना बंद करें।","फोन ठेवा किंवा उत्तर देणे थांबवा."),
  X("If you are worried, call your bank yourself on the number on your card.","चिंता हो तो कार्ड पर लिखे नंबर पर खुद बैंक को फ़ोन करें।","काळजी वाटल्यास कार्डवरील नंबरवर स्वतः बँकेला फोन करा."),
  X("Do not tap links in messages about your account, KYC or a prize.","खाते, KYC या इनाम वाले मैसेज के लिंक पर टैप न करें।","खाते, KYC किंवा बक्षिसाबद्दलच्या मेसेजमधील लिंकवर टॅप करू नका."),
  X("Never install an app or share your screen because a caller asks you to.","कॉल करने वाले के कहने पर कभी कोई ऐप डाउनलोड न करें या स्क्रीन शेयर न करें।","कॉल करणाऱ्याच्या सांगण्यावरून कधीही ॲप इन्स्टॉल करू नका किंवा स्क्रीन शेअर करू नका.")],
 w:[X("Hurry, fear and secrecy are the tricks. A real bank gives you time.","जल्दबाज़ी, डर और गोपनीयता, यही चालें हैं। असली बैंक आपको समय देता है।","घाई, भीती आणि गुप्तता, याच युक्त्या आहेत. खरी बँक तुम्हाला वेळ देते."),
  X("Some callers pretend to be police and say you are under “digital arrest”. Police never do this on a video call. Hang up and call 112.","कुछ लोग पुलिस बनकर कहते हैं कि आप “डिजिटल अरेस्ट” में हैं। पुलिस वीडियो कॉल पर ऐसा कभी नहीं करती। फ़ोन काटें और 112 पर कॉल करें।","काही लोक पोलीस असल्याचे भासवून तुम्ही “डिजिटल अरेस्ट” मध्ये आहात असे सांगतात. पोलीस व्हिडिओ कॉलवर असे कधीच करत नाहीत. फोन ठेवा आणि 112 वर कॉल करा.")]},
{id:"jobscams",sec:"safe",kw:"job scam work from home task registration fee part time telegram whatsapp doubling scheme ponzi chain investment",rel:["codes","where-save"],case:"c7",
 t:X("Fake jobs and money schemes","नकली नौकरियाँ और पैसों की स्कीमें","बनावट नोकऱ्या आणि पैशांच्या योजना"),
 s:X("A real job pays you. If you have to pay first, or your money doubles fast, walk away.","असली नौकरी आपको पैसे देती है। अगर पहले आपको देना पड़े, या पैसा जल्दी दोगुना हो, तो दूर रहें।","खरी नोकरी तुम्हाला पैसे देते. आधी तुम्हाला पैसे द्यावे लागत असतील, किंवा पैसे लवकर दुप्पट होत असतील, तर दूर रहा."),
 st:[X("Ask: do I have to pay anything to start? If yes, stop.","पूछें: क्या शुरू करने के लिए कुछ देना है? अगर हाँ, तो रुकें।","विचारा: सुरू करण्यासाठी काही भरावे लागेल का? हो असेल तर थांबा."),
  X("Ask: is the return much higher and faster than normal? If yes, stop.","पूछें: क्या कमाई सामान्य से बहुत ज़्यादा और जल्दी है? अगर हाँ, तो रुकें।","विचारा: परतावा नेहमीपेक्षा खूप जास्त आणि लवकर आहे का? हो असेल तर थांबा."),
  X("Ask: do I earn more by bringing in friends? If yes, it is a scheme.","पूछें: क्या दोस्तों को जोड़ने पर ज़्यादा कमाई है? अगर हाँ, तो यह स्कीम है।","विचारा: मित्र जोडल्यावर जास्त कमाई आहे का? हो असेल तर ही योजना आहे."),
  X("Report fake jobs on 1930 or cybercrime.gov.in, and deposit schemes at sachet.rbi.org.in.","नकली नौकरियों की रिपोर्ट 1930 या cybercrime.gov.in पर करें, और जमा योजनाओं की sachet.rbi.org.in पर।","बनावट नोकऱ्यांची तक्रार 1930 किंवा cybercrime.gov.in वर करा, आणि ठेव योजनांची sachet.rbi.org.in वर.")],
 w:[X("Being paid small amounts at first is how these scams win your trust.","शुरू में छोटी रकम मिलना ही इन धोखों का भरोसा जीतने का तरीका है।","सुरुवातीला छोटी रक्कम मिळणे हीच या फसवणुकीची विश्वास जिंकण्याची पद्धत आहे.")]},
{id:"loanapps",sec:"safe",kw:"loan app instant loan harassment contacts photos recovery agent threat",rel:["borrow","fraud"],case:"c6",
 t:X("Loan apps","लोन ऐप","लोन ॲप्स"),
 s:X("Some instant loan apps charge very high fees and harass borrowers. Check carefully before you download one.","कुछ तुरंत लोन देने वाले ऐप बहुत ज़्यादा फ़ीस लेते हैं और कर्ज़ लेने वालों को परेशान करते हैं। डाउनलोड से पहले ध्यान से जाँचें।","काही झटपट कर्ज देणारी ॲप्स खूप जास्त फी घेतात आणि कर्जदारांना त्रास देतात. डाउनलोड करण्याआधी नीट तपासा."),
 st:[X("Check that the app names the bank or RBI-registered company that is lending.","देखें कि ऐप उस बैंक या RBI में पंजीकृत कंपनी का नाम बताता है जो कर्ज़ दे रही है।","कर्ज देणाऱ्या बँकेचे किंवा RBI-नोंदणीकृत कंपनीचे नाव ॲप सांगते का ते तपासा."),
  X("Refuse any app that wants your contacts or photos.","जो ऐप कॉन्टैक्ट्स या फ़ोटो माँगे, उसे मना करें।","कॉन्टॅक्ट्स किंवा फोटो मागणारे ॲप नाकारा."),
  X("Read the total repayment and every fee before you accept.","स्वीकार करने से पहले कुल चुकाने की रकम और हर फ़ीस पढ़ें।","स्वीकारण्याआधी एकूण परतफेड आणि प्रत्येक फी वाचा."),
  X("If an app harasses you or your contacts, keep screenshots and report it on 1930 or cybercrime.gov.in, and to the police.","अगर कोई ऐप आपको या आपके कॉन्टैक्ट्स को परेशान करे, तो स्क्रीनशॉट रखें और 1930 या cybercrime.gov.in पर और पुलिस में रिपोर्ट करें।","एखादे ॲप तुम्हाला किंवा तुमच्या कॉन्टॅक्ट्सना त्रास देत असेल, तर स्क्रीनशॉट ठेवा आणि 1930 किंवा cybercrime.gov.in वर व पोलिसांत तक्रार करा.")],
 w:[X("Do not take a second app loan to repay the first.","पहला कर्ज़ चुकाने के लिए दूसरे ऐप से कर्ज़ न लें।","पहिले कर्ज फेडण्यासाठी दुसऱ्या ॲपकडून कर्ज घेऊ नका.")]},
{id:"fraud",sec:"safe",kw:"fraud unauthorised transaction money debited stolen hacked report 1930 cybercrime block card refund",rel:["complaints","codes"],case:"c11",
 t:X("Money left my account and I did not send it","खाते से पैसे कट गए, मैंने नहीं भेजे","मी न पाठवता खात्यातून पैसे गेले"),
 s:X("Act within hours. How fast you report decides whether you get your money back.","कुछ ही घंटों में कदम उठाएँ। आप कितनी जल्दी रिपोर्ट करते हैं, इसी से तय होता है कि पैसा वापस मिलेगा या नहीं।","काही तासांत पावले उचला. तुम्ही किती लवकर तक्रार करता, यावरच पैसे परत मिळतील की नाही ते ठरते."),
 st:[X("Call your bank on the number on your card or passbook and block your card, UPI or account.","कार्ड या पासबुक पर लिखे नंबर पर बैंक को फ़ोन करें और कार्ड, UPI या खाता ब्लॉक कराएँ।","कार्ड किंवा पासबुकवरील नंबरवर बँकेला फोन करा आणि कार्ड, UPI किंवा खाते ब्लॉक करा."),
  X("Call 1930 or report at cybercrime.gov.in.","1930 पर कॉल करें या cybercrime.gov.in पर रिपोर्ट करें।","1930 वर कॉल करा किंवा cybercrime.gov.in वर तक्रार करा."),
  X("Tell the bank in writing too, and keep the SMS, screenshots and complaint number.","बैंक को लिखित में भी बताएँ, और SMS, स्क्रीनशॉट व शिकायत नंबर रखें।","बँकेला लेखी कळवा, आणि SMS, स्क्रीनशॉट व तक्रार क्रमांक ठेवा."),
  X("Under RBI rules, if you report within 3 working days you should usually not lose the money, and the bank should put it back within 10 working days.","RBI के नियमों के अनुसार, 3 कामकाजी दिनों में रिपोर्ट करने पर आमतौर पर आपका पैसा नहीं जाना चाहिए, और बैंक को 10 कामकाजी दिनों में रकम वापस खाते में डालनी चाहिए।","RBI च्या नियमांनुसार, 3 कामकाजाच्या दिवसांत तक्रार केल्यास सहसा तुमचे पैसे जायला नकोत, आणि बँकेने 10 कामकाजाच्या दिवसांत रक्कम परत खात्यात जमा करायला हवी.")],
 w:[X("If you shared your OTP or PIN, the rules may protect you less. Report at once anyway.","अगर आपने OTP या PIN बताया था, तो नियम कम सुरक्षा दे सकते हैं। फिर भी तुरंत रिपोर्ट करें।","तुम्ही OTP किंवा PIN सांगितला असेल तर नियम कमी संरक्षण देऊ शकतात. तरीही लगेच तक्रार करा."),
  X("Anyone offering to “recover” your money for a fee is running another scam.","जो फ़ीस लेकर पैसा “वापस दिलाने” की बात करे, वह एक और धोखा है।","फी घेऊन पैसे “परत मिळवून देतो” म्हणणारा आणखी एक फसवणूक करत आहे.")]},
{id:"renting",sec:"live",kw:"rent room landlord deposit agreement receipt hostel pg flat electricity water",rel:["budget","complaints"],case:"c2",
 t:X("Renting a room","कमरा किराए पर लेना","खोली भाड्याने घेणे"),
 s:X("Never pay rent or a deposit without proof, and read the agreement before you sign.","बिना सबूत के कभी किराया या डिपॉज़िट न दें, और हस्ताक्षर से पहले एग्रीमेंट पढ़ें।","पुराव्याशिवाय कधीही भाडे किंवा डिपॉझिट देऊ नका, आणि सही करण्याआधी करार वाचा."),
 st:[X("Read the agreement before you sign. Check the rent, the deposit and when you get the deposit back.","हस्ताक्षर से पहले एग्रीमेंट पढ़ें। किराया, डिपॉज़िट और डिपॉज़िट कब वापस मिलेगा, यह देखें।","सही करण्याआधी करार वाचा. भाडे, डिपॉझिट आणि डिपॉझिट कधी परत मिळेल ते तपासा."),
  X("Ask who pays for electricity, water and maintenance.","पूछें कि बिजली, पानी और मेंटेनेंस का खर्च कौन देगा।","वीज, पाणी आणि देखभाल कोण भरणार ते विचारा."),
  X("Pay by bank transfer or UPI when you can, with “Rent” and the month in the note. If you pay cash, get a signed, dated receipt.","जब हो सके, बैंक ट्रांसफ़र या UPI से भरें, नोट में “किराया” और महीना लिखें। नकद दें तो हस्ताक्षर और तारीख वाली रसीद लें।","जमेल तेव्हा बँक ट्रान्सफर किंवा UPI ने भरा, टीपमध्ये “भाडे” आणि महिना लिहा. रोख दिल्यास सही व तारीख असलेली पावती घ्या."),
  X("Take photos of the room on the day you move in.","रहने आने के दिन कमरे की फ़ोटो लें।","राहायला आल्याच्या दिवशी खोलीचे फोटो काढा.")],
 w:[X("A landlord who refuses any receipt, or wants a deposit before you have seen the room, is a warning sign.","जो मकान मालिक कोई रसीद न दे, या कमरा दिखाए बिना डिपॉज़िट माँगे, वह चेतावनी का संकेत है।","कोणतीही पावती न देणारा, किंवा खोली न दाखवता डिपॉझिट मागणारा घरमालक हे धोक्याचे चिन्ह आहे.")]},
{id:"family",sec:"live",kw:"lend friend family borrow help send money home guarantor say no",rel:["borrow","budget"],case:"c8",
 t:X("When friends or family ask for money","जब दोस्त या परिवार पैसे माँगें","मित्र किंवा कुटुंबाने पैसे मागितले तर"),
 s:X("Helping is good, but only lend what you could manage to lose.","मदद करना अच्छा है, पर उतना ही दें जितना खोकर भी काम चल जाए।","मदत करणे चांगले आहे, पण गेले तरी चालेल तेवढेच द्या."),
 st:[X("Check your own month first: rent, food and travel.","पहले अपना महीना देखें: किराया, खाना और आना-जाना।","आधी तुमचा महिना पहा: भाडे, जेवण आणि प्रवास."),
  X("If you send money home every month, put it in your budget as a need.","अगर हर महीने घर पैसे भेजते हैं, तो उसे बजट में ज़रूरत की तरह रखें।","दरमहा घरी पैसे पाठवत असाल तर ते बजेटमध्ये गरज म्हणून ठेवा."),
  X("If you lend, agree a date to repay and write it down.","उधार दें तो लौटाने की तारीख तय करें और लिख लें।","उधार दिल्यास परतफेडीची तारीख ठरवा आणि लिहून ठेवा."),
  X("It is fine to say no, or to give a smaller amount you can spare.","मना करना, या उतनी छोटी रकम देना जितनी दे सकें, ठीक है।","नकार देणे किंवा जमेल तेवढी छोटी रक्कम देणे, यात काही चूक नाही.")],
 w:[X("Never sign as guarantor unless you could repay the whole loan yourself.","तब तक गारंटर न बनें, जब तक पूरा कर्ज़ खुद चुका न सकें।","संपूर्ण कर्ज स्वतः फेडू शकत नसाल, तर कधीही जामीनदार होऊ नका.")]},
{id:"complaints",sec:"live",kw:"complaint rights rbi ombudsman cms consumer helpline 1915 1930 112 refund shop bank problem",rel:["fraud","renting"],
 t:X("Your rights and where to complain","आपके अधिकार और शिकायत कहाँ करें","तुमचे अधिकार आणि तक्रार कुठे करावी"),
 s:X("You have the right to fair treatment from banks and shops. Complain step by step, and keep proof.","बैंकों और दुकानों से उचित व्यवहार पाना आपका अधिकार है। क्रम से शिकायत करें और सबूत रखें।","बँका आणि दुकानांकडून योग्य वागणूक मिळणे हा तुमचा अधिकार आहे. टप्प्याटप्प्याने तक्रार करा आणि पुरावा ठेवा."),
 st:[X("Bank problem: complain to the bank first, in writing, and note the complaint number.","बैंक की समस्या: पहले बैंक में लिखित शिकायत करें और शिकायत नंबर लिखें।","बँकेची समस्या: आधी बँकेत लेखी तक्रार करा आणि तक्रार क्रमांक लिहून ठेवा."),
  X("If the bank has not solved it in 30 days, complain to the RBI at cms.rbi.org.in. It is free.","अगर बैंक 30 दिनों में हल न करे, तो cms.rbi.org.in पर RBI से शिकायत करें। यह मुफ़्त है।","बँकेने 30 दिवसांत सोडवले नाही तर cms.rbi.org.in वर RBI कडे तक्रार करा. हे मोफत आहे."),
  X("Problem with a shop, product or service: call the National Consumer Helpline on 1915.","दुकान, सामान या सेवा की समस्या: राष्ट्रीय उपभोक्ता हेल्पलाइन 1915 पर कॉल करें।","दुकान, वस्तू किंवा सेवेची समस्या: राष्ट्रीय ग्राहक हेल्पलाइन 1915 वर कॉल करा."),
  X("Online fraud: 1930 or cybercrime.gov.in. Emergency: 112.","ऑनलाइन धोखाधड़ी: 1930 या cybercrime.gov.in। आपात स्थिति: 112।","ऑनलाइन फसवणूक: 1930 किंवा cybercrime.gov.in. आपत्कालीन: 112.")],
 w:[X("Keep bills, receipts, SMS and screenshots. Proof is what makes a complaint work.","बिल, रसीदें, SMS और स्क्रीनशॉट रखें। सबूत से ही शिकायत असरदार होती है।","बिले, पावत्या, SMS आणि स्क्रीनशॉट ठेवा. पुराव्यामुळेच तक्रार परिणामकारक होते.")]}
];

const CASES=[
{id:"c1",topic:"save",g:"budget",t:X("Priya's first pay","प्रिया का पहला वेतन","प्रियाचा पहिला पगार"),
 story:X("Priya, 18, has just been paid ₹12,000 for her first month at a shop. Rent and food cost her ₹6,500. Her mother has asked for ₹3,000 for home, her friends want her to put ₹1,500 towards a party, and she has wanted a new phone for months.","18 साल की प्रिया को दुकान में पहले महीने का ₹12,000 वेतन मिला है। किराया और खाना ₹6,500 का है। माँ ने घर के लिए ₹3,000 माँगे हैं, दोस्त चाहते हैं कि वह पार्टी के लिए ₹1,500 दे, और वह महीनों से नया फ़ोन चाहती है।","18 वर्षांच्या प्रियाला दुकानातील पहिल्या महिन्याचा ₹12,000 पगार मिळाला आहे. भाडे आणि जेवण ₹6,500 चे आहे. आईने घरासाठी ₹3,000 मागितले आहेत, मित्रांना वाटते तिने पार्टीसाठी ₹1,500 द्यावेत, आणि तिला अनेक महिन्यांपासून नवीन फोन हवा आहे."),
 q:X("How should Priya plan this month?","प्रिया को यह महीना कैसे प्लान करना चाहिए?","प्रियाने हा महिना कसा नियोजित करावा?"),
 a:[X("Put savings aside first, even ₹1,000.","पहले बचत अलग करें, चाहे ₹1,000 ही।","आधी बचत बाजूला करा, अगदी ₹1,000 तरी."),
  X("Pay the needs: ₹6,500 for rent and food, and the ₹3,000 for home if she has agreed to help.","ज़रूरतें चुकाएँ: किराया और खाना ₹6,500, और घर के ₹3,000 अगर उसने मदद का वादा किया है।","गरजा भागवा: भाडे आणि जेवण ₹6,500, आणि घरासाठी ₹3,000 जर तिने मदतीचे कबूल केले असेल तर."),
  X("That leaves ₹1,500 for everything else. A ₹1,500 party would use all of it, so she can suggest something cheaper.","इसके बाद बाकी सब के लिए ₹1,500 बचते हैं। ₹1,500 की पार्टी सब खा जाएगी, इसलिए वह कुछ सस्ता सुझा सकती है।","त्यानंतर बाकी सगळ्यासाठी ₹1,500 उरतात. ₹1,500 ची पार्टी सगळे संपवेल, म्हणून ती काहीतरी स्वस्त सुचवू शकते."),
  X("Start a phone goal and save towards it every week, instead of buying on EMI.","EMI पर खरीदने के बजाय फ़ोन का लक्ष्य बनाकर हर हफ़्ते बचत करें।","EMI वर घेण्याऐवजी फोनचे लक्ष्य ठेवून दर आठवड्याला बचत करा.")],
 why:X("Saving first and listing needs before wants shows what she can really afford. Without a plan, the party and the phone would come first, and home or savings would lose out.","पहले बचत और फिर इच्छाओं से पहले ज़रूरतें लिखने से पता चलता है कि वह असल में क्या खर्च कर सकती है। बिना योजना के पार्टी और फ़ोन पहले आते, और घर या बचत पीछे रह जाते।","आधी बचत आणि इच्छांआधी गरजांची यादी केल्याने तिला खरोखर काय परवडते ते कळते. योजनेशिवाय पार्टी आणि फोन आधी आले असते, आणि घर किंवा बचत मागे पडली असती.")},
{id:"c2",topic:"live",g:"renting",t:X("Rahul's room deposit","राहुल का कमरे का डिपॉज़िट","राहुलचे खोलीचे डिपॉझिट"),
 story:X("Rahul has found a room near his college. The landlord wants an ₹8,000 deposit and the first month's rent of ₹4,000, in cash, today. He says an agreement is “not needed”.","राहुल को कॉलेज के पास एक कमरा मिला है। मकान मालिक आज ही नकद ₹8,000 डिपॉज़िट और पहले महीने का ₹4,000 किराया चाहता है। वह कहता है कि एग्रीमेंट की “ज़रूरत नहीं”।","राहुलला कॉलेजजवळ एक खोली मिळाली आहे. घरमालकाला आजच रोख ₹8,000 डिपॉझिट आणि पहिल्या महिन्याचे ₹4,000 भाडे हवे आहे. तो म्हणतो करार “गरजेचा नाही”."),
 q:X("What should Rahul do before he pays?","भुगतान से पहले राहुल को क्या करना चाहिए?","पैसे देण्याआधी राहुलने काय करावे?"),
 a:[X("Ask for a written agreement that states the rent, the deposit and when the deposit is returned.","लिखित एग्रीमेंट माँगें जिसमें किराया, डिपॉज़िट और डिपॉज़िट वापसी की तारीख लिखी हो।","भाडे, डिपॉझिट आणि डिपॉझिट परत मिळण्याची वेळ लिहिलेला लेखी करार मागा."),
  X("Pay by bank transfer or UPI, or get a signed, dated receipt for any cash.","बैंक ट्रांसफ़र या UPI से भरें, या नकद के लिए हस्ताक्षर और तारीख वाली रसीद लें।","बँक ट्रान्सफर किंवा UPI ने भरा, किंवा रोख दिल्यास सही व तारीख असलेली पावती घ्या."),
  X("Take photos of the room's condition on day one.","पहले दिन कमरे की हालत की फ़ोटो लें।","पहिल्याच दिवशी खोलीच्या स्थितीचे फोटो काढा."),
  X("If the landlord refuses any proof, keep looking.","अगर मकान मालिक कोई सबूत देने से मना करे, तो दूसरा कमरा खोजें।","घरमालकाने कोणताही पुरावा द्यायला नकार दिला, तर दुसरी खोली शोधा.")],
 why:X("Without proof, Rahul cannot show he paid ₹12,000 if there is a dispute later. Deposits are the money young renters most often lose.","सबूत के बिना, बाद में झगड़ा होने पर राहुल यह नहीं दिखा पाएगा कि उसने ₹12,000 दिए। युवा किरायेदार सबसे ज़्यादा डिपॉज़िट का पैसा ही गँवाते हैं।","पुराव्याशिवाय, नंतर वाद झाल्यास राहुल ₹12,000 दिल्याचे दाखवू शकणार नाही. तरुण भाडेकरू सर्वात जास्त डिपॉझिटचे पैसेच गमावतात.")},
{id:"c3",topic:"safe",g:"codes",t:X("Sana's KYC message","सना का KYC मैसेज","सनाचा KYC मेसेज"),
 story:X("Sana gets an SMS: “Your bank account will be blocked today. Update KYC now: bit.ly/kyc-upd8”. The link opens a page that looks exactly like her bank's website.","सना को SMS आता है: “आपका बैंक खाता आज बंद हो जाएगा। अभी KYC अपडेट करें: bit.ly/kyc-upd8”। लिंक खोलने पर बिल्कुल उसके बैंक जैसी वेबसाइट दिखती है।","सनाला SMS येतो: “तुमचे बँक खाते आज बंद होईल. आत्ताच KYC अपडेट करा: bit.ly/kyc-upd8”. लिंक उघडल्यावर अगदी तिच्या बँकेसारखी वेबसाइट दिसते."),
 q:X("What should Sana do?","सना को क्या करना चाहिए?","सनाने काय करावे?"),
 a:[X("Do not tap the link or type anything into that page.","लिंक पर टैप न करे और उस पेज पर कुछ न लिखे।","लिंकवर टॅप करू नये आणि त्या पानावर काहीही लिहू नये."),
  X("Check in her bank's own app, or visit the branch.","अपने बैंक के ऐप में या शाखा जाकर जाँच करे।","बँकेच्या स्वतःच्या ॲपमध्ये किंवा शाखेत जाऊन तपासावे."),
  X("Delete the message and report it at cybercrime.gov.in.","मैसेज डिलीट करे और cybercrime.gov.in पर रिपोर्ट करे।","मेसेज डिलीट करून cybercrime.gov.in वर तक्रार करावी.")],
 why:X("Banks do not send links that threaten to block your account. Fake pages copy a bank's look to steal login details.","बैंक खाता बंद करने की धमकी वाले लिंक नहीं भेजते। नकली पेज बैंक जैसा दिखकर लॉगिन जानकारी चुराते हैं।","बँका खाते बंद करण्याची धमकी देणाऱ्या लिंक पाठवत नाहीत. बनावट पाने बँकेसारखी दिसून लॉगिन माहिती चोरतात.")},
{id:"c4",topic:"bank",g:"bsbd",t:X("Imran's missing ₹150","इमरान के गायब ₹150","इम्रानचे गायब ₹150"),
 story:X("Imran opened a savings account and keeps about ₹300 in it. Every few months, ₹150 disappears from his balance. He does not know why.","इमरान ने बचत खाता खोला है और उसमें लगभग ₹300 रखता है। हर कुछ महीनों में उसके बैलेंस से ₹150 गायब हो जाते हैं। उसे पता नहीं क्यों।","इम्रानने बचत खाते उघडले आहे आणि त्यात सुमारे ₹300 ठेवतो. दर काही महिन्यांनी त्याच्या शिलकीतून ₹150 गायब होतात. त्याला कारण माहीत नाही."),
 q:X("What is probably happening, and what can Imran do?","शायद क्या हो रहा है, और इमरान क्या कर सकता है?","बहुधा काय होत आहे, आणि इम्रान काय करू शकतो?"),
 a:[X("Check the statement. It is most likely a charge for not keeping the minimum balance.","स्टेटमेंट देखें। सबसे संभव है कि यह न्यूनतम बैलेंस न रखने का चार्ज है।","स्टेटमेंट पहा. बहुधा हा किमान शिल्लक न ठेवल्याचा दंड आहे."),
  X("Ask the bank to convert his account to a zero-balance (BSBD) account.","बैंक से खाते को ज़ीरो-बैलेंस (BSBD) खाते में बदलने को कहें।","बँकेला खाते झिरो-बॅलन्स (BSBD) खात्यात बदलायला सांगा."),
  X("Read bank SMS every month to spot other charges.","दूसरे चार्ज पकड़ने के लिए हर महीने बैंक SMS पढ़ें।","इतर शुल्क लक्षात येण्यासाठी दरमहा बँक SMS वाचा.")],
 why:X("Many regular savings accounts charge you when the balance falls below a minimum. A BSBD account has no minimum balance.","कई सामान्य बचत खाते बैलेंस न्यूनतम से कम होने पर चार्ज लेते हैं। BSBD खाते में न्यूनतम बैलेंस नहीं होता।","अनेक साधी बचत खाती शिल्लक किमानपेक्षा कमी झाल्यास दंड घेतात. BSBD खात्यात किमान शिल्लक नसते.")},
{id:"c5",topic:"borrow",g:"bnpl",t:X("Neha's “no-cost” phone","नेहा का “नो-कॉस्ट” फ़ोन","नेहाचा “नो-कॉस्ट” फोन"),
 story:X("Neha sees a ₹15,000 phone on “no-cost EMI”: ₹1,250 a month for 12 months, plus a ₹999 processing fee. Her current phone works but is slow.","नेहा को “नो-कॉस्ट EMI” पर ₹15,000 का फ़ोन दिखता है: 12 महीने तक ₹1,250 महीना, साथ में ₹999 प्रोसेसिंग फ़ीस। उसका पुराना फ़ोन चलता है, पर धीमा है।","नेहाला “नो-कॉस्ट EMI” वर ₹15,000 चा फोन दिसतो: 12 महिने ₹1,250 दरमहा, अधिक ₹999 प्रोसेसिंग फी. तिचा सध्याचा फोन चालतो, पण हळू आहे."),
 q:X("Is this really “no cost”? What should Neha think about?","क्या यह सच में “नो-कॉस्ट” है? नेहा को किन बातों पर सोचना चाहिए?","हे खरोखर “नो-कॉस्ट” आहे का? नेहाने कशाचा विचार करावा?"),
 a:[X("Total: 12 × ₹1,250 + ₹999 = ₹15,999. That is ₹999 more than the price.","कुल: 12 × ₹1,250 + ₹999 = ₹15,999। यह कीमत से ₹999 ज़्यादा है।","एकूण: 12 × ₹1,250 + ₹999 = ₹15,999. हे किमतीपेक्षा ₹999 जास्त आहे."),
  X("It is a loan. A missed payment hurts her credit record.","यह कर्ज़ है। एक भी किस्त चूकी तो क्रेडिट रिकॉर्ड खराब होगा।","हे कर्ज आहे. एक जरी हप्ता चुकला तर क्रेडिट रेकॉर्ड खराब होईल."),
  X("If the phone can wait, saving ₹1,250 a month buys it in a year with no fee and no debt.","अगर फ़ोन रुक सकता है, तो ₹1,250 महीना बचाकर साल भर में बिना फ़ीस और बिना कर्ज़ के खरीद सकती है।","फोन थांबू शकत असेल, तर दरमहा ₹1,250 वाचवून वर्षभरात फीशिवाय आणि कर्जाशिवाय घेता येईल.")],
 why:X("“No-cost” offers often hide a fee. Always compare the total you pay with the cash price.","“नो-कॉस्ट” ऑफ़र में अक्सर फ़ीस छिपी होती है। हमेशा कुल रकम की नकद कीमत से तुलना करें।","“नो-कॉस्ट” ऑफरमध्ये बहुधा फी लपलेली असते. नेहमी एकूण रकमेची रोख किमतीशी तुलना करा.")},
{id:"c6",topic:"safe",g:"loanapps",t:X("Deepak and the loan app","दीपक और लोन ऐप","दीपक आणि लोन ॲप"),
 story:X("Deepak borrowed ₹5,000 from a loan app. He is late paying it back, and now the app is messaging his contacts and calling him many times a day. He is thinking of borrowing from a second app to pay off the first.","दीपक ने एक लोन ऐप से ₹5,000 लिए। वह लौटाने में देर कर चुका है, और अब ऐप उसके कॉन्टैक्ट्स को मैसेज भेज रहा है और उसे दिन में कई बार फ़ोन करता है। वह पहले को चुकाने के लिए दूसरे ऐप से कर्ज़ लेने की सोच रहा है।","दीपकने एका लोन ॲपकडून ₹5,000 घेतले. परतफेडीला उशीर झाला आहे, आणि आता ॲप त्याच्या कॉन्टॅक्ट्सना मेसेज पाठवत आहे आणि त्याला दिवसातून अनेकदा फोन करत आहे. पहिले फेडण्यासाठी तो दुसऱ्या ॲपकडून कर्ज घेण्याचा विचार करत आहे."),
 q:X("What should Deepak do?","दीपक को क्या करना चाहिए?","दीपकने काय करावे?"),
 a:[X("Do not borrow from another app. That only makes the debt grow.","दूसरे ऐप से कर्ज़ न ले। इससे कर्ज़ और बढ़ेगा।","दुसऱ्या ॲपकडून कर्ज घेऊ नये. त्यामुळे कर्ज आणखी वाढेल."),
  X("Take screenshots of every threat and message.","हर धमकी और मैसेज का स्क्रीनशॉट ले।","प्रत्येक धमकीचा आणि मेसेजचा स्क्रीनशॉट घ्यावा."),
  X("Report it on 1930 or cybercrime.gov.in, and to the police.","1930 या cybercrime.gov.in पर और पुलिस में रिपोर्ट करे।","1930 किंवा cybercrime.gov.in वर आणि पोलिसांत तक्रार करावी."),
  X("Talk to a trusted adult, and pay what he owes only through official channels, with a receipt.","किसी भरोसेमंद बड़े से बात करे, और बकाया सिर्फ़ आधिकारिक तरीके से, रसीद के साथ चुकाए।","विश्वासू मोठ्या व्यक्तीशी बोलावे, आणि देणे फक्त अधिकृत मार्गाने, पावतीसह फेडावे.")],
 why:X("Lenders are not allowed to threaten or shame borrowers. Reporting with proof protects him; borrowing more only deepens the problem.","कर्ज़दाताओं को धमकाने या शर्मिंदा करने की अनुमति नहीं है। सबूत के साथ रिपोर्ट करना उसे बचाता है; और कर्ज़ लेना समस्या को गहरा करता है।","कर्जदात्यांना धमकावण्याची किंवा लाजवण्याची परवानगी नाही. पुराव्यासह तक्रार केल्याने त्याचे संरक्षण होते; आणखी कर्ज घेतल्याने समस्या वाढते.")},
{id:"c7",topic:"safe",g:"jobscams",t:X("Kavya's work-from-home offer","काव्या का वर्क-फ़्रॉम-होम ऑफ़र","काव्याची वर्क-फ्रॉम-होम ऑफर"),
 story:X("Kavya gets a WhatsApp message: “Earn ₹800 a day liking videos. Pay ₹500 registration to start.” Her friend says she was paid ₹200 on her first day.","काव्या को WhatsApp मैसेज आता है: “वीडियो लाइक करके रोज़ ₹800 कमाएँ। शुरू करने के लिए ₹500 रजिस्ट्रेशन दें।” उसकी दोस्त कहती है कि उसे पहले दिन ₹200 मिले।","काव्याला WhatsApp मेसेज येतो: “व्हिडिओ लाईक करून दररोज ₹800 कमवा. सुरू करण्यासाठी ₹500 नोंदणी शुल्क भरा.” तिची मैत्रीण म्हणते तिला पहिल्या दिवशी ₹200 मिळाले."),
 q:X("Should Kavya join?","क्या काव्या को जुड़ना चाहिए?","काव्याने सामील व्हावे का?"),
 a:[X("No. A real job never charges you to start.","नहीं। असली नौकरी शुरू करने के पैसे कभी नहीं माँगती।","नाही. खरी नोकरी सुरू करण्यासाठी कधीच पैसे मागत नाही."),
  X("Her friend's small early payment is how these scams win trust before asking for more.","दोस्त को मिली छोटी शुरुआती रकम ही ऐसे धोखों का भरोसा जीतने का तरीका है, फिर वे ज़्यादा माँगते हैं।","मैत्रिणीला मिळालेली छोटी सुरुवातीची रक्कम हीच अशा फसवणुकीची विश्वास जिंकण्याची पद्धत आहे, मग ते जास्त मागतात."),
  X("Block the number and report it on 1930 or cybercrime.gov.in, and warn her friend.","नंबर ब्लॉक करे, 1930 या cybercrime.gov.in पर रिपोर्ट करे, और दोस्त को सावधान करे।","नंबर ब्लॉक करावा, 1930 किंवा cybercrime.gov.in वर तक्रार करावी, आणि मैत्रिणीला सावध करावे.")],
 why:X("These “task” scams pay small amounts at first, then ask for bigger “deposits” that never come back.","ये “टास्क” वाले धोखे शुरू में छोटी रकम देते हैं, फिर बड़े “डिपॉज़िट” माँगते हैं जो कभी वापस नहीं आते।","या “टास्क” फसवणुकी सुरुवातीला छोटी रक्कम देतात, मग मोठे “डिपॉझिट” मागतात जे कधीच परत येत नाहीत.")},
{id:"c8",topic:"borrow",g:"borrow",t:X("Aman is asked to be a guarantor","अमन से गारंटर बनने को कहा गया","अमनला जामीनदार व्हायला सांगितले"),
 story:X("Aman's cousin asks him to sign as guarantor for a ₹50,000 bike loan. “It's just a signature,” the cousin says.","अमन का कज़िन उसे ₹50,000 के बाइक लोन के लिए गारंटर बनने को कहता है। कज़िन कहता है, “बस एक हस्ताक्षर है।”","अमनचा चुलत भाऊ त्याला ₹50,000 च्या बाईक कर्जासाठी जामीनदार म्हणून सही करायला सांगतो. तो म्हणतो, “फक्त एक सही आहे.”"),
 q:X("What would signing mean for Aman?","हस्ताक्षर करने का अमन के लिए क्या मतलब होगा?","सही केल्याचा अमनसाठी काय अर्थ होईल?"),
 a:[X("If the cousin stops paying, the lender can ask Aman to pay the whole amount.","अगर कज़िन चुकाना बंद कर दे, तो कर्ज़दाता अमन से पूरी रकम माँग सकता है।","भावाने फेडणे थांबवले, तर कर्जदाता अमनकडून पूर्ण रक्कम मागू शकतो."),
  X("Missed payments can also hurt Aman's own credit record.","चूकी हुई किस्तें अमन के अपने क्रेडिट रिकॉर्ड को भी खराब कर सकती हैं।","चुकलेले हप्ते अमनच्या स्वतःच्या क्रेडिट रेकॉर्डलाही हानी पोहोचवू शकतात."),
  X("He should only sign if he could repay ₹50,000 himself. Saying no kindly is fine.","उसे तभी हस्ताक्षर करना चाहिए जब वह खुद ₹50,000 चुका सके। विनम्रता से मना करना ठीक है।","तो स्वतः ₹50,000 फेडू शकत असेल तरच सही करावी. नम्रपणे नकार देणे योग्य आहे.")],
 why:X("A guarantor makes a legal promise to repay. It is not a formality.","गारंटर चुकाने का कानूनी वादा करता है। यह सिर्फ़ औपचारिकता नहीं है।","जामीनदार परतफेडीचे कायदेशीर वचन देतो. ही फक्त औपचारिकता नाही.")},
{id:"c9",topic:"save",g:"emergency",t:X("Anita's hospital bill","अनीता का अस्पताल का बिल","अनिताचे रुग्णालयाचे बिल"),
 story:X("Anita's mother needs a ₹4,000 hospital test this week. Anita has ₹1,500 saved and ₹2,000 left for the month. A loan app offers her ₹4,000 instantly.","अनीता की माँ को इस हफ़्ते ₹4,000 का अस्पताल टेस्ट कराना है। अनीता के पास ₹1,500 बचत है और महीने के ₹2,000 बचे हैं। एक लोन ऐप उसे तुरंत ₹4,000 दे रहा है।","अनिताच्या आईला या आठवड्यात ₹4,000 ची रुग्णालय तपासणी करायची आहे. अनिताकडे ₹1,500 बचत आहे आणि महिन्याचे ₹2,000 उरले आहेत. एक लोन ॲप तिला लगेच ₹4,000 देत आहे."),
 q:X("What are Anita's best options?","अनीता के सबसे अच्छे विकल्प क्या हैं?","अनितासमोरील सर्वोत्तम पर्याय कोणते?"),
 a:[X("Ask the hospital about a government scheme, a cheaper option or paying in parts.","अस्पताल से सरकारी योजना, सस्ते विकल्प या किस्तों के बारे में पूछे।","रुग्णालयाकडे सरकारी योजना, स्वस्त पर्याय किंवा हप्त्यांबद्दल विचारावे."),
  X("Check whether the family has health insurance or is in a government health scheme.","देखे कि परिवार के पास स्वास्थ्य बीमा है या वह किसी सरकारी स्वास्थ्य योजना में है।","कुटुंबाकडे आरोग्य विमा आहे का किंवा ते सरकारी आरोग्य योजनेत आहेत का ते तपासावे."),
  X("Use her savings. This is what an emergency fund is for.","अपनी बचत इस्तेमाल करे। आपातकालीन फ़ंड इसी के लिए होता है।","तिची बचत वापरावी. आपत्कालीन निधी याचसाठी असतो."),
  X("If she still needs to borrow, ask family or a bank before any instant app.","अगर फिर भी उधार चाहिए, तो किसी तुरंत लोन ऐप से पहले परिवार या बैंक से पूछे।","तरीही उधार लागले, तर झटपट ॲपआधी कुटुंब किंवा बँकेकडे विचारावे.")],
 why:X("Asking the hospital and checking cover can lower the cost before any borrowing. Instant apps are the most expensive and risky choice.","अस्पताल से पूछने और बीमा जाँचने से उधार से पहले ही खर्च कम हो सकता है। तुरंत लोन ऐप सबसे महँगा और जोखिम भरा विकल्प है।","रुग्णालयाकडे विचारल्याने आणि विमा तपासल्याने उधाराआधीच खर्च कमी होऊ शकतो. झटपट लोन ॲप हा सर्वात महाग आणि धोकादायक पर्याय आहे.")},
{id:"c10",topic:"borrow",g:"edu",t:X("Vikram's exam fee","विक्रम की परीक्षा फ़ीस","विक्रमची परीक्षा फी"),
 story:X("Vikram's ₹3,000 exam fee is due in 10 days and he has ₹800. A friend says a local moneylender will lend him ₹2,200 at 10% a month.","विक्रम की ₹3,000 परीक्षा फ़ीस 10 दिन में भरनी है और उसके पास ₹800 हैं। एक दोस्त कहता है कि एक स्थानीय साहूकार उसे 10% महीना ब्याज पर ₹2,200 दे देगा।","विक्रमची ₹3,000 परीक्षा फी 10 दिवसांत भरायची आहे आणि त्याच्याकडे ₹800 आहेत. एक मित्र म्हणतो की स्थानिक सावकार त्याला दरमहा 10% व्याजाने ₹2,200 देईल."),
 q:X("Where should Vikram look first?","विक्रम को सबसे पहले कहाँ देखना चाहिए?","विक्रमने आधी कुठे पाहावे?"),
 a:[X("Ask the college office about paying in two parts or a fee waiver.","कॉलेज ऑफ़िस से दो किस्तों या फ़ीस माफ़ी के बारे में पूछे।","कॉलेज ऑफिसकडे दोन हप्त्यांबद्दल किंवा फी माफीबद्दल विचारावे."),
  X("Check whether he is eligible for a scholarship on the national or state portal.","राष्ट्रीय या राज्य पोर्टल पर देखे कि क्या वह स्कॉलरशिप के योग्य है।","राष्ट्रीय किंवा राज्य पोर्टलवर तो शिष्यवृत्तीसाठी पात्र आहे का ते पहावे."),
  X("Take extra hours at work or cut back for two weeks.","दो हफ़्ते अतिरिक्त काम करे या खर्च कम करे।","दोन आठवडे जास्त काम करावे किंवा खर्च कमी करावा."),
  X("Borrow only as a last step, from family, with a written plan to repay.","उधार सिर्फ़ आखिरी कदम हो, परिवार से, लौटाने की लिखित योजना के साथ।","उधार फक्त शेवटचा पर्याय म्हणून, कुटुंबाकडून, परतफेडीच्या लेखी योजनेसह घ्यावे.")],

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

  story:X(`A shop sells ${nm[0]} for ${rs(P)}, or on “no-cost EMI”: ${rs(m)} a month for ${n} months, plus a ${rs(f)} processing fee paid today.`,`एक दुकान ${nm[1]} ${rs(P)} में बेच रही है, या “नो-कॉस्ट EMI” पर: ${n} महीने तक ${rs(m)} महीना, साथ में आज ${rs(f)} प्रोसेसिंग फ़ीस।`,`एक दुकान ${nm[2]} ${rs(P)} ला विकत आहे, किंवा “नो-कॉस्ट EMI” वर: ${n} महिने दरमहा ${rs(m)}, अधिक आज ${rs(f)} प्रोसेसिंग फी.`),
  q:X("What does it really cost, and what are your options?","असल में इसकी कीमत क्या है, और आपके पास क्या विकल्प हैं?","याची खरी किंमत किती, आणि तुमच्यासमोर कोणते पर्याय आहेत?"),
  a:[X(`Total on EMI: ${n} × ${rs(m)} + ${rs(f)} = ${rs(tot)}. That is ${rs(tot-P)} more than paying now.`,`EMI पर कुल: ${n} × ${rs(m)} + ${rs(f)} = ${rs(tot)}। यह अभी खरीदने से ${rs(tot-P)} ज़्यादा है।`,`EMI वर एकूण: ${n} × ${rs(m)} + ${rs(f)} = ${rs(tot)}. हे आत्ता घेण्यापेक्षा ${rs(tot-P)} जास्त आहे.`),
   X("It is a loan. One missed payment hurts your credit record.","यह कर्ज़ है। एक भी किस्त चूकी तो क्रेडिट रिकॉर्ड खराब होगा।","हे कर्ज आहे. एक जरी हप्ता चुकला तरी क्रेडिट रेकॉर्ड खराब होईल."),
   X(`Saving ${rs(m)} a month gets you there in about ${mo} months, with no fee and no debt.`,`हर महीने ${rs(m)} बचाने पर लगभग ${mo} महीनों में बिना फ़ीस और बिना कर्ज़ के खरीद सकते हैं।`,`दरमहा ${rs(m)} वाचवल्यास सुमारे ${mo} महिन्यांत फी आणि कर्जाशिवाय घेता येईल.`),
   X("If you do choose the EMI, list it in your budget as a need and set a reminder before each date.","अगर EMI लेते हैं, तो उसे बजट में ज़रूरत की तरह लिखें और हर तारीख से पहले रिमाइंडर लगाएँ।","EMI घेतल्यास ती बजेटमध्ये गरज म्हणून लिहा आणि प्रत्येक तारखेआधी आठवण ठेवा.")],
  why:X("A small monthly number hides the total. Always compare the full cost with the cash price.","छोटी मासिक रकम कुल खर्च छिपा लेती है। हमेशा पूरी लागत की नकद कीमत से तुलना करें।","छोटी मासिक रक्कम एकूण खर्च लपवते. नेहमी पूर्ण खर्चाची रोख किमतीशी तुलना करा.")}}},
scam:{topic:"safe",g:"codes",make(r){
 const amt=pick(r,[499,999,1500,2000,5000]);const fee=pick(r,[49,99,150,250]);
 const V=[
 {t:X("The electricity cut message","बिजली कटने का मैसेज","वीज कापण्याचा मेसेज"),g:"codes",
  s:X("An SMS says: “Your electricity will be cut tonight at 9:30 pm because last month's bill is unpaid. Call our officer on 98XXXXXX12 now.” You paid the bill.","SMS आता है: “पिछले महीने का बिल नहीं भरा गया है, इसलिए आज रात 9:30 बजे आपकी बिजली काट दी जाएगी। अभी हमारे अधिकारी को 98XXXXXX12 पर कॉल करें।” आपने बिल भर दिया है।","SMS येतो: “मागील महिन्याचे बिल भरलेले नाही, म्हणून आज रात्री 9:30 वाजता तुमची वीज कापली जाईल. आत्ताच आमच्या अधिकाऱ्याला 98XXXXXX12 वर कॉल करा.” तुम्ही बिल भरले आहे."),
  a:[X("Do not call that number.","उस नंबर पर कॉल न करें।","त्या नंबरवर कॉल करू नका."),X("Check your bill on the electricity company's official app or website, or at its office.","बिजली कंपनी के आधिकारिक ऐप, वेबसाइट या दफ़्तर में बिल जाँचें।","वीज कंपनीच्या अधिकृत ॲप, वेबसाइट किंवा कार्यालयात बिल तपासा."),X("Report the number at cybercrime.gov.in.","नंबर की रिपोर्ट cybercrime.gov.in पर करें।","नंबरची तक्रार cybercrime.gov.in वर करा.")],
  w:X("Power companies do not send personal mobile numbers or threaten to cut supply tonight. The caller will ask you to install an app or pay through a link.","बिजली कंपनियाँ निजी मोबाइल नंबर नहीं भेजतीं और आज रात बिजली काटने की धमकी नहीं देतीं। कॉल पर आपसे ऐप डाउनलोड करने या लिंक से भुगतान करने को कहा जाएगा।","वीज कंपन्या खाजगी मोबाइल नंबर पाठवत नाहीत किंवा आज रात्री वीज कापण्याची धमकी देत नाहीत. कॉलवर तुम्हाला ॲप इन्स्टॉल करायला किंवा लिंकवरून पैसे भरायला सांगितले जाईल.")},
 {t:X("The parcel fee","पार्सल की फ़ीस","पार्सलची फी"),g:"codes",
  s:X(`A message says: “Your parcel is held at the warehouse. Pay a ${rs(fee)} redelivery fee here: bit.ly/xxx”. You are not expecting a parcel.`,`मैसेज आता है: “आपका पार्सल गोदाम में रुका है। ${rs(fee)} दोबारा डिलीवरी फ़ीस यहाँ दें: bit.ly/xxx”। आप कोई पार्सल नहीं मँगा रहे।`,`मेसेज येतो: “तुमचे पार्सल गोदामात अडकले आहे. ${rs(fee)} पुन्हा डिलिव्हरी फी इथे भरा: bit.ly/xxx”. तुम्ही कोणतेही पार्सल मागवलेले नाही.`),
  a:[X("Do not tap the link or pay.","लिंक पर टैप न करें, न भुगतान करें।","लिंकवर टॅप करू नका, पैसेही भरू नका."),X("If you are expecting something, check it on the courier's official website with your own tracking number.","अगर कुछ मँगाया है, तो कूरियर की आधिकारिक वेबसाइट पर अपने ट्रैकिंग नंबर से जाँचें।","काही मागवले असेल तर कुरिअरच्या अधिकृत वेबसाइटवर तुमच्या ट्रॅकिंग नंबरने तपासा."),X("Delete the message and report it at cybercrime.gov.in.","मैसेज डिलीट करें और cybercrime.gov.in पर रिपोर्ट करें।","मेसेज डिलीट करा आणि cybercrime.gov.in वर तक्रार करा.")],
  w:X("The small fee is bait. The page steals your card or UPI details, and the real loss is much bigger.","छोटी फ़ीस चारा है। पेज आपके कार्ड या UPI की जानकारी चुराता है, और असली नुकसान कहीं बड़ा होता है।","छोटी फी हे आमिष आहे. पान तुमच्या कार्ड किंवा UPI ची माहिती चोरते, आणि खरे नुकसान खूप मोठे असते.")},
 {t:X("The cashback QR code","कैशबैक वाला QR कोड","कॅशबॅकचा QR कोड"),g:"upi",
  s:X(`Someone sends you a QR code on WhatsApp: “Congratulations! You won ${rs(amt)} cashback. Scan this and enter your UPI PIN to receive it.”`,`कोई WhatsApp पर QR कोड भेजता है: “बधाई हो! आपने ${rs(amt)} कैशबैक जीता है। इसे पाने के लिए स्कैन करें और UPI PIN डालें।”`,`कोणीतरी WhatsApp वर QR कोड पाठवतो: “अभिनंदन! तुम्ही ${rs(amt)} कॅशबॅक जिंकले आहे. ते मिळवण्यासाठी स्कॅन करा आणि UPI PIN टाका.”`),
  a:[X("Do not scan it or enter your PIN.","इसे स्कैन न करें और PIN न डालें।","तो स्कॅन करू नका आणि PIN टाकू नका."),X("Block the sender and report it on 1930 or cybercrime.gov.in.","भेजने वाले को ब्लॉक करें और 1930 या cybercrime.gov.in पर रिपोर्ट करें।","पाठवणाऱ्याला ब्लॉक करा आणि 1930 किंवा cybercrime.gov.in वर तक्रार करा.")],
  w:X(`Scanning a code and entering your PIN sends money out. You would lose ${rs(amt)}, not receive it.`,`कोड स्कैन करके PIN डालने से पैसे जाते हैं। आपको ${rs(amt)} मिलेंगे नहीं, जाएँगे।`,`कोड स्कॅन करून PIN टाकल्याने पैसे जातात. तुम्हाला ${rs(amt)} मिळणार नाहीत, जातील.`)},
 {t:X("The “police” video call","“पुलिस” का वीडियो कॉल","“पोलिसांचा” व्हिडिओ कॉल"),g:"codes",
  s:X(`A video caller in uniform says your Aadhaar has been used in a crime and you are under “digital arrest”. You must not tell anyone, and must transfer ${rs(amt*10)} to “verify” your account.`,`वर्दी में एक व्यक्ति वीडियो कॉल पर कहता है कि आपके आधार का इस्तेमाल किसी अपराध में हुआ है और आप “डिजिटल अरेस्ट” में हैं। आपको किसी को नहीं बताना है, और खाता “वेरिफ़ाई” करने के लिए ${rs(amt*10)} भेजने हैं।`,`गणवेशातील एक व्यक्ती व्हिडिओ कॉलवर म्हणते की तुमचे आधार एका गुन्ह्यात वापरले गेले आहे आणि तुम्ही “डिजिटल अरेस्ट” मध्ये आहात. कोणालाही सांगायचे नाही, आणि खाते “व्हेरिफाय” करण्यासाठी ${rs(amt*10)} पाठवायचे आहेत.`),
  a:[X("Hang up. There is no such thing as a digital arrest.","फ़ोन काट दें। “डिजिटल अरेस्ट” जैसी कोई चीज़ नहीं होती।","फोन ठेवा. “डिजिटल अरेस्ट” असे काहीच नसते."),X("Tell a trusted adult straight away.","तुरंत किसी भरोसेमंद बड़े को बताएँ।","लगेच एखाद्या विश्वासू मोठ्या व्यक्तीला सांगा."),X("Report it on 1930, or call 112 if you feel threatened.","1930 पर रिपोर्ट करें, या डर लगे तो 112 पर कॉल करें।","1930 वर तक्रार करा, किंवा भीती वाटल्यास 112 वर कॉल करा.")],
  w:X("Real police never arrest anyone on a video call or ask for money to “verify” you. Fear and secrecy are the trick.","असली पुलिस वीडियो कॉल पर कभी गिरफ़्तार नहीं करती और “वेरिफ़िकेशन” के लिए पैसे नहीं माँगती। डर और गोपनीयता ही चाल है।","खरे पोलीस कधीही व्हिडिओ कॉलवर अटक करत नाहीत किंवा “व्हेरिफिकेशन” साठी पैसे मागत नाहीत. भीती आणि गुप्तता हीच युक्ती आहे.")},
 {t:X("The “wrong transfer” request","“गलती से भेजे” पैसों की रिक्वेस्ट","“चुकून पाठवलेल्या” पैशांची रिक्वेस्ट"),g:"upi",
  s:X(`You get a UPI request for ${rs(amt)}, then a message: “Sorry, I sent you ${rs(amt)} by mistake! Please return it, just approve my request.” Your balance has not changed.`,`आपको ${rs(amt)} की UPI रिक्वेस्ट आती है, फिर मैसेज: “सॉरी, गलती से आपको ${rs(amt)} भेज दिए! प्लीज़ लौटा दें, बस मेरी रिक्वेस्ट मंज़ूर कर दें।” आपका बैलेंस नहीं बदला।`,`तुम्हाला ${rs(amt)} ची UPI रिक्वेस्ट येते, मग मेसेज: “सॉरी, चुकून तुम्हाला ${rs(amt)} पाठवले! प्लीज परत करा, फक्त माझी रिक्वेस्ट मंजूर करा.” तुमची शिल्लक बदललेली नाही.`),
  a:[X("Check your balance in your own bank app.","अपने बैंक ऐप में बैलेंस देखें।","तुमच्या बँक ॲपमध्ये शिल्लक तपासा."),X("Decline the request.","रिक्वेस्ट मना करें।","रिक्वेस्ट नाकारा."),X("If money really did arrive by mistake, tell your bank, not the stranger.","अगर सच में गलती से पैसे आए हों, तो बैंक को बताएँ, अजनबी को नहीं।","खरोखर चुकून पैसे आले असतील तर बँकेला सांगा, अनोळखी व्यक्तीला नाही.")],
  w:X("Approving a request always sends your money out. Receiving money never needs your PIN.","रिक्वेस्ट मंज़ूर करने से हमेशा पैसा जाता है। पैसे पाने के लिए कभी PIN नहीं चाहिए।","रिक्वेस्ट मंजूर केल्याने नेहमी पैसे जातात. पैसे मिळवण्यासाठी कधीच PIN लागत नाही.")},
 {t:X("The call from “your bank”","“आपके बैंक” से कॉल","“तुमच्या बँकेकडून” कॉल"),g:"codes",
  s:X("A caller knows your name and the last four digits of your card. He says: “Your card will be blocked in 10 minutes. Tell me the OTP we just sent to stop it.”","कॉल करने वाला आपका नाम और कार्ड के आखिरी चार अंक जानता है। वह कहता है: “10 मिनट में आपका कार्ड ब्लॉक हो जाएगा। रोकने के लिए अभी भेजा गया OTP बताइए।”","कॉल करणाऱ्याला तुमचे नाव आणि कार्डचे शेवटचे चार अंक माहीत आहेत. तो म्हणतो: “10 मिनिटांत तुमचे कार्ड ब्लॉक होईल. ते थांबवण्यासाठी आत्ता पाठवलेला OTP सांगा.”"),
  a:[X("Do not share the OTP. Hang up.","OTP न बताएँ। फ़ोन काट दें।","OTP सांगू नका. फोन ठेवा."),X("Call the bank yourself on the number on your card.","कार्ड पर लिखे नंबर पर खुद बैंक को फ़ोन करें।","कार्डवरील नंबरवर स्वतः बँकेला फोन करा.")],
  w:X("An OTP approves a payment. Details like your name and card digits are easy to find, so they prove nothing.","OTP से भुगतान मंज़ूर होता है। नाम और कार्ड के अंक आसानी से मिल जाते हैं, इसलिए उनसे कुछ साबित नहीं होता।","OTP ने पेमेंट मंजूर होते. नाव आणि कार्डचे अंक सहज मिळतात, त्यामुळे त्यातून काहीच सिद्ध होत नाही.")},
 {t:X("The online task job","ऑनलाइन टास्क वाली नौकरी","ऑनलाइन टास्कची नोकरी"),g:"jobscams",
  s:X(`A Telegram group offers ₹${fee*8} a day for rating products. To unlock tasks you must first deposit ${rs(amt)}. The first task paid ₹${fee}.`,`एक टेलीग्राम ग्रुप प्रोडक्ट रेट करने के लिए रोज़ ₹${fee*8} दे रहा है। टास्क खोलने के लिए पहले ${rs(amt)} जमा करने हैं। पहले टास्क में ₹${fee} मिले।`,`एक टेलिग्राम ग्रुप उत्पादनांना रेटिंग देण्यासाठी दररोज ₹${fee*8} देत आहे. टास्क उघडण्यासाठी आधी ${rs(amt)} जमा करायचे आहेत. पहिल्या टास्कमध्ये ₹${fee} मिळाले.`),
  a:[X("Do not deposit anything. Leave the group.","कुछ भी जमा न करें। ग्रुप छोड़ दें।","काहीही जमा करू नका. ग्रुप सोडा."),X("Report it on 1930 or cybercrime.gov.in.","1930 या cybercrime.gov.in पर रिपोर्ट करें।","1930 किंवा cybercrime.gov.in वर तक्रार करा.")],
  w:X("The small first payment is bait. Each “level” asks for a bigger deposit that never comes back.","पहली छोटी कमाई चारा है। हर “लेवल” पर बड़ी रकम माँगी जाती है जो कभी वापस नहीं आती।","पहिली छोटी कमाई हे आमिष आहे. प्रत्येक “लेव्हल” वर मोठी रक्कम मागितली जाते जी कधीच परत येत नाही.")},
 {t:X("The 30% a week investment","हर हफ़्ते 30% वाला निवेश","दर आठवड्याला 30% ची गुंतवणूक"),g:"jobscams",
  s:X(`An Instagram page shows screenshots of people earning 30% a week from “trading”. The minimum to join is ${rs(amt)}.`,`एक इंस्टाग्राम पेज “ट्रेडिंग” से हर हफ़्ते 30% कमाने वालों के स्क्रीनशॉट दिखाता है। जुड़ने के लिए कम से कम ${rs(amt)} चाहिए।`,`एक इन्स्टाग्राम पेज “ट्रेडिंग” मधून दर आठवड्याला 30% कमावणाऱ्यांचे स्क्रीनशॉट दाखवते. सामील होण्यासाठी किमान ${rs(amt)} लागतात.`),
  a:[X("Do not send money. Real investments never promise returns like this.","पैसे न भेजें। असली निवेश ऐसी कमाई का वादा कभी नहीं करते।","पैसे पाठवू नका. खरी गुंतवणूक असा परतावा कधीच देण्याचे वचन देत नाही."),X("Report the page, and tell friends who follow it.","पेज की रिपोर्ट करें, और जो दोस्त इसे फ़ॉलो करते हैं उन्हें बताएँ।","पानाची तक्रार करा, आणि जे मित्र ते फॉलो करतात त्यांना सांगा.")],
  w:X("30% a week would turn ₹1,000 into over ₹8 lakh in a year. Promises like that are always fraud, and screenshots are easy to fake.","हर हफ़्ते 30% से ₹1,000 एक साल में ₹8 लाख से ज़्यादा हो जाएँगे। ऐसे वादे हमेशा धोखा होते हैं, और स्क्रीनशॉट आसानी से नकली बनते हैं।","दर आठवड्याला 30% ने ₹1,000 एका वर्षात ₹8 लाखांपेक्षा जास्त होतील. अशी वचने नेहमी फसवणूक असतात, आणि स्क्रीनशॉट सहज बनावट करता येतात.")}];
 const v=pick(r,V);
 return{g:v.g,t:v.t,story:v.s,q:X("What do you do?","आप क्या करेंगे?","तुम्ही काय कराल?"),a:v.a,why:v.w}}},
loan:{topic:"borrow",g:"borrow",make(r){
 const RS=[[X("Your exam fee is due","परीक्षा फ़ीस भरनी है","परीक्षा फी भरायची आहे"),X("the college","कॉलेज","कॉलेज")],[X("The bike you need for work needs repairs","काम के लिए ज़रूरी बाइक की मरम्मत करानी है","कामासाठी लागणाऱ्या बाईकची दुरुस्ती करायची आहे"),X("the garage","गैरेज","गॅरेज")],[X("Your hostel wants its deposit","हॉस्टल डिपॉज़िट माँग रहा है","हॉस्टेल डिपॉझिट मागत आहे"),X("the hostel","हॉस्टल","हॉस्टेल")]];
 const rs_=pick(r,RS);const N=rint(r,2000,6000,500);const h=rint(r,500,1500,100);const L=N-h;const app=Math.round(L*.2);const len=Math.round(L*1.331)-L;
 return{t:X(`Short by ${rs(L)}`,`${rs(L)} कम पड़ रहे हैं`,`${rs(L)} कमी पडत आहेत`),
  story:X(`${rs_[0][0]}: ${rs(N)} in 10 days. You have ${rs(h)}. A loan app offers the ${rs(L)} now, to repay ${rs(L+app)} in 30 days. A moneylender offers it at 10% a month.`,`${rs_[0][1]}: 10 दिन में ${rs(N)}। आपके पास ${rs(h)} हैं। एक लोन ऐप अभी ${rs(L)} दे रहा है, 30 दिन में ${rs(L+app)} लौटाने हैं। एक साहूकार 10% महीना ब्याज पर दे रहा है।`,`${rs_[0][2]}: 10 दिवसांत ${rs(N)}. तुमच्याकडे ${rs(h)} आहेत. एक लोन ॲप आत्ता ${rs(L)} देत आहे, 30 दिवसांत ${rs(L+app)} परत करायचे. एक सावकार दरमहा 10% व्याजाने देत आहे.`),
  q:X("What does each choice cost, and what would you do first?","हर विकल्प की कीमत क्या है, और आप सबसे पहले क्या करेंगे?","प्रत्येक पर्यायाची किंमत किती, आणि तुम्ही आधी काय कराल?"),
  a:[X(`Ask ${rs_[1][0]} first if you can pay in parts. That costs nothing extra.`,`सबसे पहले ${rs_[1][1]} से पूछें कि क्या किस्तों में दे सकते हैं। इसमें कोई अतिरिक्त खर्च नहीं।`,`आधी ${rs_[1][2]} कडे हप्त्यांत देता येईल का ते विचारा. यात जास्तीचा खर्च नाही.`),
   X(`The app costs ${rs(app)} extra for one month, and may ask for your contacts.`,`ऐप एक महीने के लिए ${rs(app)} ज़्यादा लेता है, और कॉन्टैक्ट्स माँग सकता है।`,`ॲप एका महिन्यासाठी ${rs(app)} जास्त घेते, आणि कॉन्टॅक्ट्स मागू शकते.`),
   X(`At 10% a month, the moneylender's ${rs(L)} grows by about ${rs(len)} in three months.`,`10% महीने पर साहूकार के ${rs(L)} तीन महीने में लगभग ${rs(len)} बढ़ जाते हैं।`,`दरमहा 10% ने सावकाराचे ${rs(L)} तीन महिन्यांत सुमारे ${rs(len)} ने वाढतात.`),
   X("If you must borrow, ask family with a written repayment plan, before any app or moneylender.","अगर उधार लेना ही है, तो किसी ऐप या साहूकार से पहले परिवार से, लिखित योजना के साथ लें।","उधार घ्यावेच लागले, तर कोणत्याही ॲप किंवा सावकाराआधी कुटुंबाकडून, लेखी योजनेसह घ्या.")],
  why:X("The place you owe often has options that cost nothing. Compare the total you would repay before choosing.","जिसे पैसे देने हैं, उसके पास अक्सर बिना खर्च के विकल्प होते हैं। चुनने से पहले कुल चुकाई जाने वाली रकम की तुलना करें।","ज्याला पैसे द्यायचे आहेत, त्याच्याकडे बहुधा खर्चाशिवायचे पर्याय असतात. निवडण्याआधी एकूण परतफेडीची तुलना करा.")}}},
emergency:{topic:"save",g:"emergency",make(r){
 const RS=[X("Your mother needs medicine the doctor has prescribed","माँ को डॉक्टर की लिखी दवा चाहिए","आईला डॉक्टरांनी लिहून दिलेले औषध हवे आहे"),X("Your phone, which you need for work, has stopped working","काम के लिए ज़रूरी आपका फ़ोन बंद हो गया है","कामासाठी लागणारा तुमचा फोन बंद पडला आहे"),X("You have a bad toothache and need a dentist","आपके दाँत में तेज़ दर्द है और डेंटिस्ट के पास जाना है","तुमचा दात खूप दुखत आहे आणि दंतवैद्याकडे जायचे आहे"),X("The cycle you ride to college has been stolen","कॉलेज जाने वाली आपकी साइकिल चोरी हो गई","कॉलेजला जाण्याची तुमची सायकल चोरीला गेली")];
 const why_=pick(r,RS);const C=rint(r,1500,6000,500);const Sv=rint(r,500,5000,500);const enough=Sv>=C;const gap=C-Sv;const refill=Math.max(200,r100(C/4));
 return{t:X(`An unexpected ${rs(C)}`,`अचानक ${rs(C)} का खर्च`,`अचानक ${rs(C)} चा खर्च`),
  story:X(`${why_[0]}. It will cost about ${rs(C)}. You have ${rs(Sv)} in emergency savings, and a loan app is offering instant money.`,`${why_[1]}। इसमें लगभग ${rs(C)} लगेंगे। आपकी आपातकालीन बचत ${rs(Sv)} है, और एक लोन ऐप तुरंत पैसे दे रहा है।`,`${why_[2]}. यासाठी सुमारे ${rs(C)} लागतील. तुमची आपत्कालीन बचत ${rs(Sv)} आहे, आणि एक लोन ॲप लगेच पैसे देत आहे.`),
  q:X("How would you pay for it?","आप इसका खर्च कैसे उठाएँगे?","तुम्ही हा खर्च कसा भागवाल?"),
  a:enough?[X(`Use your emergency savings. This is exactly what they are for.`,`अपनी आपातकालीन बचत इस्तेमाल करें। यह इसी के लिए है।`,`तुमची आपत्कालीन बचत वापरा. ती याचसाठी आहे.`),
    X("First ask if there is a cheaper option, such as a government hospital, a generic medicine or a repair instead of a new one.","पहले पूछें कि क्या कोई सस्ता विकल्प है, जैसे सरकारी अस्पताल, जेनेरिक दवा, या नया लेने के बजाय मरम्मत।","आधी विचारा की स्वस्त पर्याय आहे का, जसे सरकारी रुग्णालय, जेनेरिक औषध, किंवा नवीन घेण्याऐवजी दुरुस्ती."),
    X(`Then refill the fund, about ${rs(refill)} a month until it is back.`,`फिर फ़ंड दोबारा भरें, लगभग ${rs(refill)} महीना जब तक वह पूरा न हो।`,`मग निधी पुन्हा भरा, पूर्ण होईपर्यंत दरमहा सुमारे ${rs(refill)}.`)]
   :[X(`Use your ${rs(Sv)} savings first.`,`पहले अपनी ${rs(Sv)} की बचत इस्तेमाल करें।`,`आधी तुमची ${rs(Sv)} ची बचत वापरा.`),
    X("Ask for a cheaper option or to pay in parts: a government hospital, generic medicine or a repair.","सस्ता विकल्प या किस्तें माँगें: सरकारी अस्पताल, जेनेरिक दवा या मरम्मत।","स्वस्त पर्याय किंवा हप्ते मागा: सरकारी रुग्णालय, जेनेरिक औषध किंवा दुरुस्ती."),
    X(`For the remaining ${rs(gap)}, cut wants this month or ask family, before any loan app.`,`बाकी ${rs(gap)} के लिए, किसी लोन ऐप से पहले इस महीने इच्छाएँ कम करें या परिवार से पूछें।`,`उरलेल्या ${rs(gap)} साठी, कोणत्याही लोन ॲपआधी या महिन्यात इच्छा कमी करा किंवा कुटुंबाला विचारा.`),
    X("Afterwards, build the fund up so the next one is covered.","इसके बाद फ़ंड फिर से बनाएँ, ताकि अगली बार काम आए।","त्यानंतर निधी पुन्हा तयार करा, म्हणजे पुढच्या वेळी उपयोगी पडेल.")],
  why:X("Emergency savings turn a crisis into an inconvenience. Instant loan apps are the most expensive way to pay for one.","आपातकालीन बचत संकट को सिर्फ़ एक परेशानी बना देती है। तुरंत लोन ऐप इसका सबसे महँगा तरीका है।","आपत्कालीन बचत संकटाला फक्त एक अडचण बनवते. झटपट लोन ॲप हा त्यासाठी सर्वात महाग मार्ग आहे.")}}},
subs:{topic:"save",g:"budget",make(r){
 const L=[[X("Music app","म्यूज़िक ऐप","म्युझिक ॲप"),99],[X("Video app","वीडियो ऐप","व्हिडिओ ॲप"),149],[X("Second video app","दूसरा वीडियो ऐप","दुसरे व्हिडिओ ॲप"),199],[X("Game pass","गेम पास","गेम पास"),129],[X("Cloud storage","क्लाउड स्टोरेज","क्लाउड स्टोरेज"),75],[X("Fitness app","फ़िटनेस ऐप","फिटनेस ॲप"),299]];
 const sh=L.slice().sort(()=>r()-.5).slice(0,4).map(x=>[x[0],x[1],pick(r,[0,1,1,3,6,10,20])]);if(!sh.some(x=>x[2]<2))sh[0][2]=0;const cut=sh.filter(x=>x[2]<2);const yr=cut.reduce((a,x)=>a+x[1],0)*12;const tot=sh.reduce((a,x)=>a+x[1],0);
 const list=i=>sh.map(x=>`${x[0][i]} ${rs(x[1])} (${x[2]} ${['h','घंटे','तास'][i]})`).join(', ');
 return{t:X(`${rs(tot)} a month in subscriptions`,`हर महीने ${rs(tot)} के सब्सक्रिप्शन`,`दरमहा ${rs(tot)} ची सबस्क्रिप्शन`),
  story:X(`Your bank statement shows these monthly auto-payments, with how many hours you used each last month: ${list(0)}.`,`आपके बैंक स्टेटमेंट में ये मासिक ऑटो-पेमेंट हैं, साथ में पिछले महीने हर एक को कितने घंटे इस्तेमाल किया: ${list(1)}।`,`तुमच्या बँक स्टेटमेंटमध्ये ही मासिक ऑटो-पेमेंट आहेत, सोबत मागच्या महिन्यात प्रत्येक किती तास वापरले: ${list(2)}.`),
  q:X("Which would you cancel, and how much would you save in a year?","आप कौन से बंद करेंगे, और साल में कितना बचेगा?","तुम्ही कोणती बंद कराल, आणि वर्षात किती वाचतील?"),
  a:[X(`Cancel what you barely used: ${cut.map(x=>x[0][0]).join(', ')}.`,`जो लगभग इस्तेमाल नहीं किए, उन्हें बंद करें: ${cut.map(x=>x[0][1]).join(', ')}।`,`जे जवळजवळ वापरले नाही ते बंद करा: ${cut.map(x=>x[0][2]).join(', ')}.`),
   X(`That saves ${rs(yr)} a year.`,`इससे साल में ${rs(yr)} बचेंगे।`,`यामुळे वर्षाला ${rs(yr)} वाचतील.`),
   X("Cancel inside the app or in your UPI app's autopay settings. Deleting the app does not stop the payment.","ऐप के अंदर या अपने UPI ऐप की ऑटोपे सेटिंग में जाकर बंद करें। ऐप डिलीट करने से भुगतान नहीं रुकता।","ॲपमध्ये किंवा UPI ॲपच्या ऑटोपे सेटिंगमध्ये जाऊन बंद करा. ॲप डिलीट केल्याने पेमेंट थांबत नाही.")],
  why:X("Small monthly payments are easy to forget. Checking them every few months is one of the quickest ways to save.","छोटे मासिक भुगतान आसानी से भूल जाते हैं। हर कुछ महीनों में इन्हें जाँचना बचत का सबसे तेज़ तरीका है।","छोटी मासिक पेमेंट सहज विसरली जातात. दर काही महिन्यांनी ती तपासणे हा बचतीचा सर्वात जलद मार्ग आहे.")}}},
prices:{topic:"save",g:"budget",make(r){
 const p=rint(r,40,70,5),rise=pick(r,[5,10,15]),m=rint(r,20,26),ex=rise*m,home=Math.round(p*.4/5)*5,days=pick(r,[2,3]),sv=(p+rise-home)*days*4;
 return{t:X(`The canteen meal goes up by ₹${rise}`,`कैंटीन का खाना ₹${rise} महँगा`,`कँटीनचे जेवण ₹${rise} ने महाग`),
  story:X(`Your canteen lunch has gone up from ₹${p} to ₹${p+rise}. You eat there about ${m} days a month. Your income has not changed.`,`आपका कैंटीन का दोपहर का खाना ₹${p} से ₹${p+rise} हो गया है। आप महीने में लगभग ${m} दिन वहाँ खाते हैं। आपकी आमदनी नहीं बदली।`,`तुमचे कँटीनमधील दुपारचे जेवण ₹${p} वरून ₹${p+rise} झाले आहे. तुम्ही महिन्यात सुमारे ${m} दिवस तिथे जेवता. तुमचे उत्पन्न बदललेले नाही.`),
  q:X("How much more does this cost you, and what could you change?","इससे आपका खर्च कितना बढ़ेगा, और आप क्या बदल सकते हैं?","यामुळे तुमचा खर्च किती वाढेल, आणि तुम्ही काय बदलू शकता?"),
  a:[X(`${m} × ₹${rise} = ${rs(ex)} more a month, or ${rs(ex*12)} a year.`,`${m} × ₹${rise} = महीने में ${rs(ex)} ज़्यादा, यानी साल में ${rs(ex*12)}।`,`${m} × ₹${rise} = दरमहा ${rs(ex)} जास्त, म्हणजे वर्षाला ${rs(ex*12)}.`),
   X("Update your budget now, so the extra does not come out of savings by accident.","अभी बजट अपडेट करें, ताकि यह अतिरिक्त खर्च अनजाने में बचत से न निकले।","आत्ताच बजेट अपडेट करा, म्हणजे हा जास्तीचा खर्च नकळत बचतीतून जाणार नाही."),
   X(`Carrying food from home ${days} days a week (about ₹${home} a meal) would save about ${rs(sv)} a month.`,`हफ़्ते में ${days} दिन घर से खाना लाने (लगभग ₹${home} प्रति खाना) से महीने में लगभग ${rs(sv)} बचेंगे।`,`आठवड्यातून ${days} दिवस घरून डबा आणल्यास (सुमारे ₹${home} प्रति जेवण) दरमहा सुमारे ${rs(sv)} वाचतील.`)],
  why:X("Prices rise over time while income often does not. Small daily costs add up to large monthly ones.","समय के साथ दाम बढ़ते हैं, पर आमदनी अक्सर नहीं। छोटे रोज़ के खर्च जुड़कर बड़े मासिक खर्च बनते हैं।","कालांतराने किमती वाढतात, पण उत्पन्न बहुधा वाढत नाही. छोटे रोजचे खर्च मिळून मोठे मासिक खर्च होतात.")}}},
goal:{topic:"save",g:"goals",make(r){

  a:[X(`You need ${rs(P-s)} more: about ${rs(need)} a week for ${W} weeks.`,`आपको ${rs(P-s)} और चाहिए: ${W} हफ़्तों तक लगभग ${rs(need)} हर हफ़्ते।`,`तुम्हाला आणखी ${rs(P-s)} हवेत: ${W} आठवडे दर आठवड्याला सुमारे ${rs(need)}.`),

   X("Avoid an EMI to close the gap; it would cost more in total.","कमी पूरी करने के लिए EMI न लें; उससे कुल खर्च बढ़ेगा।","तूट भरण्यासाठी EMI घेऊ नका; त्याने एकूण खर्च वाढेल.")],

flat:{topic:"live",g:"renting",make(r){
