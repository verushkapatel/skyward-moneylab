 why:X("1930 is for cyber fraud. You can also report at cybercrime.gov.in. 1915 is the consumer helpline and 112 is for emergencies.","1930 साइबर धोखाधड़ी के लिए है। cybercrime.gov.in पर भी रिपोर्ट कर सकते हैं। 1915 उपभोक्ता हेल्पलाइन है और 112 आपातकाल के लिए।","1930 सायबर फसवणुकीसाठी आहे. cybercrime.gov.in वरही तक्रार करता येते. 1915 ग्राहक हेल्पलाइन आहे आणि 112 आपत्कालासाठी.")},
{id:"r5",g:"bsbd",q:X("What minimum balance does a BSBD (basic savings) account need?","BSBD (बेसिक सेविंग्स) खाते में कितना न्यूनतम बैलेंस चाहिए?","BSBD (बेसिक बचत) खात्यात किमान किती शिल्लक लागते?"),
 o:[X("Zero","शून्य","शून्य"),X("₹1,000","₹1,000","₹1,000"),X("₹500","₹500","₹500")],a:0,
 why:X("BSBD accounts have no minimum balance and come with a free ATM card. Ask for one by name.","BSBD खाते में न्यूनतम बैलेंस नहीं होता और ATM कार्ड मुफ़्त मिलता है। नाम लेकर यही खाता माँगें।","BSBD खात्याला किमान शिल्लक नसते आणि ATM कार्ड मोफत मिळतं. नाव घेऊन हेच खातं मागा.")},
{id:"r6",g:"open-account",q:X("From what age can you run your own savings account in India?","भारत में किस उम्र से आप अपना बचत खाता ख़ुद चला सकते हैं?","भारतात कोणत्या वयापासून तुम्ही स्वतःचं बचत खातं स्वतः चालवू शकता?"),
 o:[X("18","18","18"),X("10","10","10"),X("16","16","16")],a:1,
 why:X("Since April 2025, RBI lets young people aged 10 and over operate their own savings account.","अप्रैल 2025 से RBI 10 साल और उससे बड़े बच्चों को अपना बचत खाता ख़ुद चलाने देता है।","एप्रिल 2025 पासून RBI 10 वर्षे व त्याहून मोठ्या मुलांना स्वतःचं बचत खातं चालवू देते.")},
{id:"r7",g:"budget",q:X("The 50/30/20 idea splits your income into…","50/30/20 का तरीका आपकी आमदनी को बाँटता है…","50/30/20 पद्धत तुमचं उत्पन्न विभागते…"),
 o:[X("Needs, wants and savings","ज़रूरतें, इच्छाएँ और बचत","गरजा, इच्छा आणि बचत"),X("Rent, food and travel","किराया, खाना और सफ़र","भाडं, जेवण आणि प्रवास"),X("Today, this week and this month","आज, इस हफ़्ते और इस महीने","आज, या आठवड्यात आणि या महिन्यात")],a:0,
 why:X("About half for needs, some for wants, and a fixed part saved. Change the numbers to fit your life.","लगभग आधा ज़रूरतों पर, कुछ इच्छाओं पर, और एक तय हिस्सा बचत। अपनी ज़िंदगी के हिसाब से अंक बदलें।","साधारण अर्धा गरजांवर, काही इच्छांवर आणि ठरावीक भाग बचत. आपल्या आयुष्यानुसार आकडे बदला.")},
{id:"r8",g:"budget",q:X("“Pay yourself first” means…","“पहले ख़ुद को भुगतान करें” का मतलब है…","“आधी स्वतःला पैसे द्या” याचा अर्थ…"),
 o:[X("Buy yourself a treat on payday","तनख़्वाह के दिन अपने लिए कुछ ख़रीदें","पगाराच्या दिवशी स्वतःसाठी काहीतरी घ्या"),X("Save a fixed amount the day money comes in","पैसे आते ही उसी दिन तय रकम बचाएँ","पैसे येताच त्याच दिवशी ठरावीक रक्कम बाजूला ठेवा"),X("Pay your own bills before your family’s","परिवार से पहले अपने बिल भरें","कुटुंबाच्या आधी स्वतःची बिलं भरा")],a:1,
 why:X("If you wait to save what is left, there is rarely anything left. Move savings out first.","बचे हुए पैसे बचाने का इंतज़ार करेंगे तो शायद ही कुछ बचेगा। बचत पहले अलग करें।","उरलेले पैसे वाचवायची वाट पाहिली तर क्वचितच काही उरतं. बचत आधी बाजूला काढा.")},
{id:"r9",g:"emergency",q:X("An emergency fund is for…","आपातकालीन फ़ंड किसके लिए है?","आपत्कालीन निधी कशासाठी असतो?"),
 o:[X("A sale you don’t want to miss","ऐसी सेल जो आप छोड़ना नहीं चाहते","चुकवायचा नसलेला सेल"),X("Your monthly rent","हर महीने का किराया","दर महिन्याचं भाडं"),X("A sudden cost like a phone repair or doctor’s bill","अचानक ख़र्च, जैसे फ़ोन की मरम्मत या डॉक्टर का बिल","अचानक खर्च, जसं फोन दुरुस्ती किंवा डॉक्टरचं बिल")],a:2,
 why:X("It is money kept aside so a surprise does not push you into a loan. Start small, even ₹50 a week.","यह अलग रखा पैसा है ताकि अचानक ख़र्च आपको कर्ज़ में न डाले। छोटे से शुरू करें, हफ़्ते के ₹50 से भी।","अचानक खर्चामुळे कर्ज घ्यावं लागू नये म्हणून बाजूला ठेवलेले पैसे. लहान सुरुवात करा, आठवड्याला ₹50 नेही.")},
{id:"r10",g:"emergency",q:X("A good first target for an emergency fund is…","आपातकालीन फ़ंड का अच्छा पहला लक्ष्य है…","आपत्कालीन निधीचं चांगलं पहिलं लक्ष्य…"),
 o:[X("One month of basic costs","एक महीने का ज़रूरी ख़र्च","एका महिन्याचा आवश्यक खर्च"),X("One year of salary","एक साल की तनख़्वाह","एका वर्षाचा पगार"),X("Whatever is left at month end","महीने के अंत में जो बचे","महिन्याच्या शेवटी जे उरेल ते")],a:0,
 why:X("One month of basics is reachable. After that, build slowly towards three months.","एक महीने का ख़र्च जुटाना संभव है। उसके बाद धीरे-धीरे तीन महीने तक बढ़ाएँ।","एका महिन्याचा खर्च जमवणं शक्य आहे. त्यानंतर हळूहळू तीन महिन्यांपर्यंत वाढवा.")},
{id:"r11",g:"loanapps",q:X("A loan app wants access to your contacts and photos. This is…","एक लोन ऐप आपके कॉन्टैक्ट और फ़ोटो की अनुमति माँगता है। यह…","एक लोन ॲप तुमचे कॉन्टॅक्ट आणि फोटो पाहण्याची परवानगी मागतं. हे…"),
 o:[X("Normal for all loans","सभी लोन में सामान्य है","सगळ्या कर्जांसाठी सामान्य आहे"),X("A warning sign","ख़तरे का संकेत है","धोक्याची खूण आहे"),X("Needed for a lower interest rate","कम ब्याज के लिए ज़रूरी है","कमी व्याजासाठी गरजेचं आहे")],a:1,
 why:X("Real lenders do not need your contacts. Apps that ask often harass borrowers. Check the lender is RBI-registered.","असली कर्ज़दाता को आपके कॉन्टैक्ट नहीं चाहिए। ऐसे ऐप अक्सर परेशान करते हैं। जाँचें कि कर्ज़दाता RBI में पंजीकृत है।","खऱ्या कर्जदात्याला तुमचे कॉन्टॅक्ट लागत नाहीत. असे ॲप अनेकदा त्रास देतात. कर्जदाता RBI कडे नोंदणीकृत आहे का ते तपासा.")},
{id:"r12",g:"credit",q:X("If you pay only the “minimum due” on a credit card…","अगर आप क्रेडिट कार्ड पर सिर्फ़ “मिनिमम ड्यू” भरते हैं…","क्रेडिट कार्डवर फक्त “मिनिमम ड्यू” भरलं तर…"),
 o:[X("The bill is cleared","बिल पूरा चुक जाता है","बिल पूर्ण फिटतं"),X("Your score improves the most","आपका स्कोर सबसे ज़्यादा सुधरता है","तुमचा स्कोर सर्वात जास्त सुधारतो"),X("The rest keeps charging high interest","बाकी पर भारी ब्याज लगता रहता है","उरलेल्या रकमेवर मोठं व्याज लागत राहतं")],a:2,
 why:X("Card interest can be 36–42% a year on whatever you leave unpaid. Pay the full amount when you can.","बकाया रकम पर कार्ड का ब्याज साल का 36–42% तक हो सकता है। हो सके तो पूरी रकम भरें।","न भरलेल्या रकमेवर कार्डचं व्याज वर्षाला 36–42% पर्यंत असू शकतं. शक्य असेल तर पूर्ण रक्कम भरा.")},
{id:"r13",g:"bnpl",q:X("“Buy now, pay later” is really…","“अभी ख़रीदें, बाद में भरें” असल में है…","“आता घ्या, नंतर भरा” खरं तर आहे…"),
 o:[X("A discount","एक छूट","एक सवलत"),X("A loan","एक कर्ज़","एक कर्ज"),X("A free gift","एक मुफ़्त तोहफ़ा","एक मोफत भेट")],a:1,
 why:X("It is borrowing. Late fees and missed payments can hurt your credit score for years.","यह उधार है। देर से भुगतान और चूकी किस्तें सालों तक आपका क्रेडिट स्कोर बिगाड़ सकती हैं।","हे कर्जच आहे. उशिरा भरणं आणि चुकलेले हप्ते वर्षानुवर्षे क्रेडिट स्कोर खराब करू शकतात.")},
{id:"r14",g:"credit",q:X("What lowers your credit score?","आपका क्रेडिट स्कोर किससे घटता है?","तुमचा क्रेडिट स्कोर कशामुळे कमी होतो?"),
 o:[X("Checking your own score","अपना स्कोर ख़ुद देखना","स्वतःचा स्कोर स्वतः पाहणं"),X("Paying late","देर से भुगतान","उशिरा पैसे भरणं"),X("Having a savings account","बचत खाता होना","बचत खातं असणं")],a:1,
 why:X("Late or missed payments hurt most. Checking your own score does not lower it.","देर से या चूके भुगतान सबसे ज़्यादा नुकसान करते हैं। अपना स्कोर देखने से वह नहीं घटता।","उशिरा किंवा चुकलेले हप्ते सर्वात जास्त नुकसान करतात. स्वतःचा स्कोर पाहिल्याने तो कमी होत नाही.")},
{id:"r15",g:"jobscams",q:X("A job offer asks you to pay a ₹1,500 “registration fee” first. This usually means…","एक नौकरी के ऑफ़र में पहले ₹1,500 “रजिस्ट्रेशन फ़ीस” माँगी जाती है। इसका आमतौर पर मतलब है…","नोकरीच्या ऑफरमध्ये आधी ₹1,500 “नोंदणी शुल्क” मागितलं जातं. याचा साधारण अर्थ…"),
 o:[X("It is a scam","यह धोखा है","ही फसवणूक आहे"),X("It is a top company","यह बड़ी कंपनी है","ही मोठी कंपनी आहे"),X("It is normal for internships","इंटर्नशिप में यह सामान्य है","इंटर्नशिपसाठी हे सामान्य आहे")],a:0,
 why:X("Real employers pay you. They do not charge you to get the job.","असली नियोक्ता आपको पैसे देते हैं, नौकरी देने के पैसे नहीं लेते।","खरे मालक तुम्हाला पैसे देतात, नोकरी देण्यासाठी पैसे घेत नाहीत.")},
{id:"r16",g:"payslip",q:X("On a payslip, “net pay” is…","पेस्लिप पर “नेट पे” क्या है?","पगार स्लिपवर “नेट पे” म्हणजे…"),
 o:[X("Your pay before deductions","कटौती से पहले की तनख़्वाह","कपातीपूर्वीचा पगार"),X("Your yearly salary","सालाना तनख़्वाह","वार्षिक पगार"),X("What actually reaches your account","जो असल में खाते में आता है","खात्यात प्रत्यक्ष जमा होणारी रक्कम")],a:2,
 why:X("Gross pay minus deductions like PF and tax is net pay. Plan your month on this number.","ग्रॉस पे में से PF और टैक्स जैसी कटौती घटाकर नेट पे बनता है। महीने की योजना इसी से बनाएँ।","ग्रॉस पगारातून PF, कर अशा कपाती वजा केल्यावर नेट पे येतो. महिन्याचं नियोजन याच आकड्यावर करा.")},
{id:"r17",g:"payslip",q:X("PF taken from your salary is…","तनख़्वाह से कटा PF क्या है?","पगारातून कापलेला PF म्हणजे…"),
 o:[X("A fine","एक जुर्माना","एक दंड"),X("Your own savings for later, with interest","आपकी ही बचत, ब्याज के साथ","तुमचीच बचत, व्याजासह"),X("Money you lose","गँवाया हुआ पैसा","गमावलेले पैसे")],a:1,
 why:X("Provident Fund is your money, saved with interest. Your employer adds to it too.","प्रॉविडेंट फ़ंड आपका पैसा है जो ब्याज के साथ बचता है। नियोक्ता भी इसमें जोड़ता है।","प्रॉव्हिडंट फंड तुमचेच पैसे आहेत, व्याजासह जमा होतात. मालकही त्यात भर घालतो.")},
{id:"r18",g:"pan",q:X("Getting an e-PAN on the income tax website costs…","आयकर वेबसाइट से e-PAN बनवाने का ख़र्च…","आयकर वेबसाइटवर e-PAN काढण्याचा खर्च…"),
 o:[X("₹500 through an agent","एजेंट से ₹500","एजंटमार्फत ₹500"),X("Nothing","कुछ नहीं","काहीही नाही"),X("₹1,000","₹1,000","₹1,000")],a:1,
 why:X("An e-PAN with Aadhaar is free on incometax.gov.in. You do not need to pay an agent.","आधार से e-PAN incometax.gov.in पर मुफ़्त है। एजेंट को पैसे देने की ज़रूरत नहीं।","आधार वापरून e-PAN incometax.gov.in वर मोफत आहे. एजंटला पैसे द्यायची गरज नाही.")},
{id:"r19",g:"where-save",q:X("A recurring deposit (RD) is…","रिकरिंग डिपॉज़िट (RD) क्या है?","रिकरिंग डिपॉझिट (RD) म्हणजे…"),
 o:[X("A type of loan","एक तरह का कर्ज़","एक प्रकारचं कर्ज"),X("A UPI app","एक UPI ऐप","एक UPI ॲप"),X("A fixed amount saved every month for a set time","तय समय तक हर महीने जमा की गई तय रकम","ठरावीक काळासाठी दर महिन्याला जमा केलेली ठरावीक रक्कम")],a:2,
 why:X("An RD builds the saving habit. You choose the amount and the bank adds interest.","RD बचत की आदत बनाता है। रकम आप चुनते हैं और बैंक ब्याज जोड़ता है।","RD मुळे बचतीची सवय लागते. रक्कम तुम्ही ठरवता आणि बँक व्याज देते.")},
{id:"r20",g:"where-save",q:X("Someone promises to “double your money in 3 months”. This is…","कोई “3 महीने में पैसा डबल” करने का वादा करता है। यह…","कोणी “3 महिन्यांत पैसे दुप्पट” करण्याचं वचन देतो. हे…"),
 o:[X("Almost certainly a scam","लगभग पक्का धोखा है","जवळजवळ नक्की फसवणूक आहे"),X("A government scheme","सरकारी योजना है","सरकारी योजना आहे"),X("A smart investment","समझदारी का निवेश है","हुशार गुंतवणूक आहे")],a:0,

const locale=()=>({en:'en-IN',hi:'hi-IN',mr:'mr-IN'})[LANG];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayS=()=>ymd(new Date());

const ACC='skyward-accounts-v1', REMEMBER='skyward-remember-v1';
const te=new TextEncoder(), td=new TextDecoder();
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hasCrypto=!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
async function kek(secret,salt){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return{iv:b64(iv),ct:b64(ct)}}
async function unseal(key,box){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct)))}
const dataKeyFrom=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
function newRecovery(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(16));let s='';r.forEach((v,i)=>{s+=A[v%32];if(i%4===3&&i<15)s+='-'});return s}
const normCode=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
const nameKey=n=>n.trim().toLowerCase().replace(/\s+/g,' ');

function freshData(){return ensure({v:3,created:Date.now(),backedUp:0,lang:LANG})}
function ensure(D){D.tx=D.tx||[];D.cats=D.cats||DEFAULT_CATS.map(c=>({id:c.id,type:c.type}));D.limits=D.limits||{};D.goals=D.goals||[];D.strat=D.strat||{};D.cases=D.cases||{};D.wait=D.wait||[];D.skipped=D.skipped||0;D.weekly=D.weekly||{size:5,weeks:{}};
  if(D.money&&!D.migrated){const map={rent:'rent',food:'food',travel:'travel',phone:'phone',study:'study',family:'family',wants:'fun'};
    (D.money.entries||[]).forEach(e=>{if(!D.money.example)D.tx.push({id:uid(),type:'out',amt:e.amt,date:e.date,cat:map[e.cat]||'other',note:e.note||''})});
    if(!D.money.example&&D.money.fund&&D.money.fund.saved>0){const g={id:uid(),name:'',ek:true,target:D.money.fund.target||3000};D.goals.push(g);D.tx.push({id:uid(),type:'save',amt:D.money.fund.saved,date:todayS(),goal:g.id})}
    D.migrated=true;delete D.money;delete D.sims}
  D.v=3;return D}

  const g={id:'g1',name:'',ek:true,target:6600};D.goals=[g];

  D.strat={payfirst:{pct:10},split:{r:'70'}};D.limits={eatout:800,fun:600};D.example=true;const gm={xp:132,ci:{},fz:{},frz:1,best:6,cards:{},cd:{},badges:{first:1,s3:1,perfect:1,nospend:1},read:{},txx:{},wk:{},right:7,perfect:3};const td0=new Date();for(let i=1;i<=5;i++){const x=new Date(td0);x.setDate(x.getDate()-i);gm.ci[ymd(x)]=i===3?'ns':'tx';if(i!==2)gm.cd[ymd(x)]={n:1,seen:[],first:true}}D.game=gm;return D}
async function createAccount(name,pw,remember){
  const raw=crypto.getRandomValues(new Uint8Array(32));const code=newRecovery();
  const s1=crypto.getRandomValues(new Uint8Array(16)),s2=crypto.getRandomValues(new Uint8Array(16));
  const rec={v:1,name:name.trim(),s1:b64(s1),s2:b64(s2),wp:await seal(await kek(pw,s1),raw),wr:await seal(await kek(normCode(code),s2),raw),data:null,created:Date.now()};
  S={name:rec.name,rec,key:await dataKeyFrom(raw),raw,data:freshData()};await persistNow();setRemember(remember);return code}
async function openWith(rec,raw){const key=await dataKeyFrom(raw);const data=ensure(JSON.parse(td.decode(await unseal(key,rec.data))));S={name:rec.name,rec,key,raw,data};if(data.lang&&data.lang in LI&&data.lang!==LANG){LANG=data.lang;ls.set('skyward-lang',LANG);applyChrome()}}
async function login(name,pw){const rec=accounts()[nameKey(name)];if(!rec)throw new Error('nouser');let raw;try{raw=await unseal(await kek(pw,unb64(rec.s1)),rec.wp)}catch(e){throw new Error('badpw')}await openWith(rec,raw)}
async function recover(name,code,newPw){const rec=accounts()[nameKey(name)];if(!rec)throw new Error('nouser');let raw;try{raw=await unseal(await kek(normCode(code),unb64(rec.s2)),rec.wr)}catch(e){throw new Error('badcode')}
  const s1=crypto.getRandomValues(new Uint8Array(16));rec.s1=b64(s1);rec.wp=await seal(await kek(newPw,s1),raw);putAccount(rec);await openWith(rec,raw)}
async function changePassword(oldPw,newPw){try{await unseal(await kek(oldPw,unb64(S.rec.s1)),S.rec.wp)}catch(e){throw new Error('badpw')}const s1=crypto.getRandomValues(new Uint8Array(16));S.rec.s1=b64(s1);S.rec.wp=await seal(await kek(newPw,s1),S.raw);putAccount(S.rec)}
async function newRecoveryCode(){const code=newRecovery();const s2=crypto.getRandomValues(new Uint8Array(16));S.rec.s2=b64(s2);S.rec.wr=await seal(await kek(normCode(code),s2),S.raw);putAccount(S.rec);return code}
let saveTimer=null;
async function persistNow(){if(!S||!S.key)return;S.rec.data=await seal(S.key,te.encode(JSON.stringify(S.data)));putAccount(S.rec)}
function persist(){if(!S||S.guest)return;clearTimeout(saveTimer);saveTimer=setTimeout(persistNow,300)}
function setRemember(on){if(on&&S&&!S.guest)ls.set(REMEMBER,{n:nameKey(S.name),k:b64(S.raw)});else ls.del(REMEMBER)}
async function tryRemembered(){const r=ls.get(REMEMBER);if(!r||!hasCrypto)return false;const rec=accounts()[r.n];if(!rec)return false;try{await openWith(rec,unb64(r.k));return true}catch(e){ls.del(REMEMBER);return false}}
async function logout(){closeSheet();if(S&&!S.guest){clearTimeout(saveTimer);await persistNow()}setRemember(false);S=null;resetUI();route('welcome')}
function deleteAccount(){const a=accounts();delete a[nameKey(S.name)];ls.set(ACC,a);setRemember(false);S=null;resetUI();route('welcome');toast(tr('deleted'))}
function backupText(){return 'SKYWARD1.'+b64(te.encode(JSON.stringify(S.rec)))}
function restoreFrom(text){const t=text.trim();if(!t.startsWith('SKYWARD1.'))throw new Error('format');const rec=JSON.parse(td.decode(unb64(t.slice(9))));if(!rec||rec.v!==1||!rec.name||!rec.wp||!rec.data)throw new Error('format');putAccount(rec);return rec.name}

function stats(m){const tx=D().tx.filter(t=>t.date.slice(0,7)===m);let inc=0,out=0,save=0,need=0,want=0;const by={};
  tx.forEach(t=>{if(t.type==='in')inc+=t.amt;else if(t.type==='save')save+=t.amt;else{out+=t.amt;by[t.cat]=(by[t.cat]||0)+t.amt;if(catObj(t.cat).type==='need')need+=t.amt;else want+=t.amt}});
  return{inc,out,save,need,want,by,left:inc-out-save,tx}}
const daysInMonthSoFar=m=>{const [y,mo]=m.split('-').map(Number);const now=new Date();return (m===curMonth())?now.getDate():new Date(y,mo,0).getDate()};

function widget(id){const st=STRATS.find(s=>s.id===id);const cfg=D().strat[id]||{};const m=curMonth();const s=stats(m);let body='';
  if(id==='payfirst'){const p=pct(s.save,s.inc),tg=cfg.pct||10;body=`<div class="bar"><i style="width:${Math.min(100,tg?p/tg*100:0)}%"></i></div><span class="dim sm">${esc(tr('wPay',{a:p+'%',b:tg+'%'}))}</span>`}
  else if(id==='split'){const r=cfg.r==='70'?[70,20,10]:[50,30,20];const base=s.inc||(s.need+s.want+s.save)||1;
    body=`<div class="sbar"><i class="need" style="width:${pct(s.need,base)}%"></i><i class="want" style="width:${pct(s.want,base)}%"></i><i class="save" style="width:${pct(s.save,base)}%"></i></div>
    <div class="legend"><span><i class="dot need"></i>${esc(tr('needs'))} ${pct(s.need,base)}% <span class="faint">/ ${r[0]}</span></span><span><i class="dot want"></i>${esc(tr('wants'))} ${pct(s.want,base)}% <span class="faint">/ ${r[1]}</span></span><span><i class="dot save"></i>${esc(tr('savedL'))} ${pct(s.save,base)}% <span class="faint">/ ${r[2]}</span></span></div>`}
  else if(id==='limits'){const L=Object.entries(D().limits).filter(([k,v])=>v>0);if(!L.length)body=`<span class="dim sm">${esc(tr('wLimitsNone'))}</span>`;
    else{const ok=L.filter(([k,v])=>(s.by[k]||0)<=v).length;body=`<span class="dim sm">${esc(tr('wLimits',{a:ok,b:L.length}))}</span>`+L.map(([k,v])=>{const sp=s.by[k]||0;const cls=sp>v?'over':sp>=.8*v?'close':'';return `<div class="cat ${cls}"><span class="sm">${esc(catName(k))}</span><span class="amt">${rs(sp)} / ${rs(v)}</span><div class="bar"><i class="${catObj(k).type}" style="width:${Math.min(100,pct(sp,v))}%"></i></div></div>`}).join('')}}
  else if(id==='nospend'){const n=daysInMonthSoFar(m);const wd=new Set(s.tx.filter(t=>t.type==='out'&&catObj(t.cat).type==='want').map(t=>t.date));const free=Math.max(0,n-wd.size);body=`<div class="bar"><i style="width:${pct(free,n)}%"></i></div><span class="dim sm">${esc(tr('wNo',{a:free,b:n}))}</span>`}
  else if(id==='track'){const since=new Date();since.setDate(since.getDate()-29);const ss=ymd(since);const days=new Set(D().tx.filter(t=>t.date>=ss).map(t=>t.date)).size;body=`<div class="bar"><i style="width:${pct(days,30)}%"></i></div><span class="dim sm">${esc(tr('wTrack',{a:days}))}</span>`}
  else if(id==='efirst'){const g=D().goals.find(x=>x.ek);const sv=g?goalSaved(g.id):0,tg=g?g.target:0;body=`<div class="bar"><i style="width:${Math.min(100,pct(sv,tg))}%"></i></div><span class="dim sm">${esc(tr('wEf',{a:rs(sv),b:rs(tg)}))}</span>`}
  else if(id==='low'){const ms=[0,1,2].map(i=>stats(shiftMonth(m,-i)).inc).filter(v=>v>0);body=`<span class="dim sm">${esc(ms.length?tr('wLow',{a:rs(Math.min(...ms))}):tr('wLowNone'))}</span>`}
  else if(id==='wait'){body=waitHTML(true)}
  return `<div class="wid"><div class="row between"><h3>${esc(T(st.n))}</h3></div>${body}</div>`}

function pwField(id,label,auto){return `<div class="field"><label for="${id}">${esc(label)}</label><div class="pw"><input id="${id}" type="password" autocomplete="${auto}"><button type="button" data-show="${id}">${esc(tr('show'))}</button></div></div>`}
function wirePw(){$$('[data-show]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.show);const s=i.type==='password';i.type=s?'text':'password';b.textContent=tr(s?'hide':'show')})}
const langSeg=()=>`<div class="seg" role="group" aria-label="${esc(tr('language'))}">${LANGS.map(([c,n])=>`<button data-seg="${c}" aria-pressed="${c===LANG}">${n}</button>`).join('')}</div>`;
const wireSeg=()=>$$('[data-seg]').forEach(b=>b.onclick=()=>setLang(b.dataset.seg));
const credit=()=>`<div class="credit"><span>${esc(tr('runBy'))}</span><b>${esc(tr('skywardName'))}</b><b>${esc(tr('interactName'))}</b></div>`;

/* ---------- Game layer: streaks, XP, levels, recall, badges ---------- */
const LV=[0,40,100,180,280,400,550,730,950,1200];
const lvlOf=xp=>{let l=1;for(let i=0;i<LV.length;i++)if(xp>=LV[i])l=i+1;if(xp>=LV[LV.length-1])l=LV.length+Math.floor((xp-LV[LV.length-1])/300);return l};
const lvlStart=l=>l<=LV.length?LV[l-1]:LV[LV.length-1]+(l-LV.length)*300;
const lvlName=l=>tr('lv'+Math.min(l,10));
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const yestS=()=>addDays(todayS(),-1);
const BADGES=[['first','wallet'],['nospend','shield'],['s3','spark'],['s7','spark'],['s30','spark'],['perfect','star'],['q10','bulb'],['q30','shield'],['case','bulb'],['week','check'],['goal','save'],['reader','book'],['backup','lock'],['lvl5','star']];
function G(){const d=D();if(!d.game)d.game={};const g=d.game;g.xp=g.xp||0;g.ci=g.ci||{};g.fz=g.fz||{};g.frz=g.frz||0;g.best=g.best||0;g.cards=g.cards||{};g.cd=g.cd||{};g.badges=g.badges||{};g.read=g.read||{};g.txx=g.txx||{};g.wk=g.wk||{};g.right=g.right||0;g.perfect=g.perfect||0;return g}
const dayOn=(g,d)=>!!(g.ci[d]||g.fz[d]);
function streakInfo(){const g=G();const t=todayS();let d=g.ci[t]?t:yestS();let risk=false;if(!g.ci[t]&&!dayOn(g,d)){d=addDays(t,-2);risk=dayOn(g,d)}let n=0;while(dayOn(g,d)){n++;d=addDays(d,-1)}return{n,today:!!g.ci[t],risk}}
function settle(){const g=G();const t=todayS();if(g.settled===t)return;g.settled=t;
  const days=Object.keys(g.ci).concat(Object.keys(g.fz)).filter(d=>d<t).sort();const last=days[days.length-1];if(!last){persist();return}
  const miss=[];let d=addDays(last,1);const stop=addDays(t,-1);while(d<stop){miss.push(d);d=addDays(d,1)}
  if(miss.length&&miss.length<=g.frz){miss.forEach(m=>g.fz[m]=1);g.frz-=miss.length;setTimeout(()=>toast(tr('saverUsed')),400)}persist()}
let pending=[];
function gainXP(x){const g=G();const before=lvlOf(g.xp);g.xp+=x;const after=lvlOf(g.xp);if(after>before)pending.push({lv:after})}
function checkin(date,kind){const g=G();if(date!==todayS()&&date!==yestS())return 0;if(g.ci[date]){if(kind==='tx'&&g.ci[date]==='ns')g.ci[date]='tx';return 0}
  g.ci[date]=kind;gainXP(10);const s=streakInfo().n;if(s>g.best)g.best=s;
  if(s>0&&s%7===0&&g.frz<2){g.frz++;pending.push({msg:tr('saverEarned')})}
  if(date===todayS()&&g.cd[date]&&g.cd[date].first!==undefined){g.perfect++;gainXP(5);pending.push({msg:tr('perfect')})}
  return 10}
function txXP(date){const g=G();const n=g.txx[date]||0;if(n>=5)return 0;g.txx[date]=n+1;gainXP(2);return 2}
function badgeState(){const g=G(),d=D();const cnt=Object.keys(d.cases).length;const wkDone=Object.values(d.weekly.weeks).some(w=>countDone(w)>=goalCount(w));
  return{first:d.tx.length>0,nospend:Object.values(g.ci).includes('ns'),s3:g.best>=3,s7:g.best>=7,s30:g.best>=30,perfect:g.perfect>0,q10:g.right>=10,q30:g.right>=30,case:cnt>0,week:wkDone,goal:d.tx.some(t=>t.type==='save'),reader:Object.keys(g.read).length>=5,backup:!!d.backedUp,lvl5:lvlOf(g.xp)>=5}}
function checkBadges(){if(!S)return;const g=G();const st=badgeState();BADGES.forEach(([id])=>{if(st[id]&&!g.badges[id]){g.badges[id]=Date.now();pending.push({badge:id})}})}
function flush(gain){checkBadges();persist();const items=pending;pending=[];
  if(gain)celebrate(gain);const lv=items.find(i=>i.lv);const bs=items.filter(i=>i.badge);const ms=items.filter(i=>i.msg);
  let delay=gain?900:0;ms.forEach(m=>{setTimeout(()=>toast(m.msg),delay);delay+=1700});
  if(lv||bs.length)setTimeout(()=>rewardSheet(lv,bs),gain?650:0);updateSide()}

/* recall */
function pickCard(exclude){const g=G();const t=todayS();const ex=new Set(exclude||[]);
  const due=RECALL.filter(q=>g.cards[q.id]&&g.cards[q.id].due<=t&&!ex.has(q.id)).sort((a,b)=>g.cards[a.id].due.localeCompare(g.cards[b.id].due));if(due.length)return due[0];
  const order=RECALL.slice().sort((a,b)=>hashStr((S.name||'g')+a.id)-hashStr((S.name||'g')+b.id));const fresh=order.find(q=>!g.cards[q.id]&&!ex.has(q.id));if(fresh)return fresh;
  return RECALL.filter(q=>!ex.has(q.id)).sort((a,b)=>(g.cards[a.id]||{due:''}).due.localeCompare((g.cards[b.id]||{due:''}).due))[0]||RECALL[0]}
const GAPS=[1,3,7,14,30];
function answerCard(q,i){const g=G();const t=todayS();const ok=i===q.a;const c=g.cards[q.id]||{b:0,r:0,w:0};
  if(ok){c.b=Math.min((c.b||0)+1,4);c.r++;g.right++}else{c.b=0;c.w++}c.due=addDays(t,ok?GAPS[c.b]:1);g.cards[q.id]=c;
  const day=g.cd[t]||(g.cd[t]={n:0,seen:[]});const first=day.first===undefined;day.n++;day.seen.push(q.id);day.last={q:q.id,i};let xp=0;
  if(first){day.first=ok;xp=ok?10:5;gainXP(xp);if(g.ci[t]){g.perfect++;gainXP(5);xp+=5;pending.push({msg:tr('perfect')})}}
  else if(day.n<=6){xp=ok?3:1;gainXP(xp)}

function todayCard(){const g=G();const t=todayS();const s=streakInfo();const done=!!g.ci[t];const cdd=g.cd[t];const learned=cdd&&cdd.first!==undefined;const rec=recentChips();
  const yMiss=!g.ci[yestS()]&&!g.fz[yestS()]&&!S.guest&&(D().created||Date.now())<new Date(t+'T00:00').getTime();

/* ---------- Cases: weekly checklist + endless generated cases ---------- */
function secName(id){const s=SECTIONS.find(x=>x[0]===id);return s?T(s[1]):''}
function weekKey(d){d=new Date(d||Date.now());const day=(d.getDay()+6)%7;const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);return ymd(mon)}
const daysLeftInWeek=()=>7-((new Date().getDay()+6)%7);
function genSpecs(wk,size,existing){const rng=mulberry32(hashStr((S.name||'guest')+wk+(existing?existing.length:0)));const have=new Set((existing||[]).map(specKey));const out=[];
  const fixed=CASES.filter(c=>!D().cases[c.id]&&!have.has(c.id)).sort(()=>rng()-.5).slice(0,2).map(c=>({f:c.id}));
  const usedT=new Set((existing||[]).filter(s=>s.t).map(s=>s.t));const tpls=TPL_IDS.filter(x=>!usedT.has(x)).sort(()=>rng()-.5);
  let i=0;while(out.length<size){if(fixed.length&&(out.length%3===1||!tpls.length))out.push(fixed.shift());else{out.push({t:tpls[i%tpls.length]||pick(rng,TPL_IDS),s:Math.floor(rng()*2147483647)});i++}}
  return out}
function thisWeek(){const W=D().weekly;const wk=weekKey();if(!W.weeks[wk])W.weeks[wk]={size:W.size,items:genSpecs(wk,W.size),done:{}};return W.weeks[wk]}
const isDone=(w,k)=>!!w.done[k];
const countDone=w=>w.items.filter(s=>!s.bonus&&w.done[specKey(s)]).length;
const goalCount=w=>w.items.filter(s=>!s.bonus).length;
function streak(){const W=D().weekly;let n=0;let d=new Date();const cur=W.weeks[weekKey(d)];if(cur&&countDone(cur)>=goalCount(cur))n++;
  for(let i=1;i<200;i++){const k=weekKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()-7*i));const w=W.weeks[k];if(w&&countDone(w)>=goalCount(w))n++;else break}return n}
function setSize(n){const W=D().weekly;W.size=n;const w=thisWeek();const doneN=Object.keys(w.done).length;
  if(!doneN){w.items=w.items.filter(s=>s.bonus).concat(genSpecs(weekKey(),n));w.items.sort((a,b)=>(a.bonus?1:0)-(b.bonus?1:0))}
  else{let core=w.items.filter(s=>!s.bonus);const bonus=w.items.filter(s=>s.bonus);
    if(core.length<n)core=core.concat(genSpecs(weekKey(),n-core.length,core));
    else while(core.length>n){const idx=core.map((s,i)=>[s,i]).reverse().find(([s])=>!w.done[specKey(s)]);if(!idx)break;core.splice(idx[1],1)}
    w.items=core.concat(bonus)}
  w.size=n;persist();toast(tr('sizeLater',{x:n}));rerender()}
function addBonus(){const w=thisWeek();const r=mulberry32((Math.random()*2**31)|0);const recent=new Set(w.items.slice(-3).map(s=>s.t));const pool=TPL_IDS.filter(x=>!recent.has(x));
  const spec={t:pick(r,pool),s:Math.floor(r()*2147483647),bonus:true};w.items.push(spec);persist();return specKey(spec)}
function findSpec(key){const W=D().weekly;for(const wk of Object.keys(W.weeks)){const s=W.weeks[wk].items.find(x=>specKey(x)===key);if(s)return s}if(CASES.some(c=>c.id===key))return{f:key};const m=key.match(/^([a-z]+)-(\d+)$/);return m?{t:m[1],s:+m[2]}:null}
function markDone(key,val){const w=thisWeek();if(w.items.some(s=>specKey(s)===key)){if(val)w.done[key]=true;else delete w.done[key]}persist()}

  <div class="card stack"><h3>${esc(tr('privacy'))}</h3><label class="check"><input type="checkbox" id="rem" ${rem?'checked':''}><span>${esc(tr('remember'))}. ${esc(tr('remHint2'))}</span></label><button class="btn" id="out">${ICON.lock}${esc(tr('logout'))}</button></div>
  <form class="card stack" id="cp" novalidate><h3>${esc(tr('changePw'))}</h3>${pwField('c-old',tr('curPw'),'current-password')}${pwField('c-new',tr('pwNew'),'new-password')}<p class="err" id="cp-msg" role="status"></p><button class="btn ghost sm" type="submit" style="align-self:flex-start">${esc(tr('changePw'))}</button></form>
  <div class="card stack"><h3>${esc(tr('recCode'))}</h3><p class="dim sm">${esc(tr('recHint'))}</p><button class="btn ghost sm" id="nrc" style="align-self:flex-start">${esc(tr('makeNewRec'))}</button></div>
  <div class="card stack"><h3>${esc(tr('delT'))}</h3><p class="dim sm">${esc(tr('delHint'))}</p><button class="btn danger sm" id="del" style="align-self:flex-start">${esc(tr('delBtn'))}</button><div id="confirm"></div></div>${credit()}`;
  wirePw();wireSeg();const mark=()=>{D().backedUp=Date.now();persist()};wireRemind();
  $('#bk-copy').onclick=async()=>{await persistNow();const t=backupText();$('#bk-text').value=t;$('#bk-wrap').hidden=false;try{await navigator.clipboard.writeText(t);toast(tr('bkCopied'))}catch(e){$('#bk-text').select();toast(tr('selected'))}mark()};
  if($('#bk-file'))$('#bk-file').onclick=async()=>{await persistNow();try{await saveFile('skyward-backup-'+(S.name.replace(/[^a-z0-9]/gi,'').toLowerCase()||'account')+'.txt',backupText());mark();toast(tr('bkSaved'));flush(0)}catch(e){toast(tr('bkNotSaved'))}};
  $('#rem').onchange=e=>{setRemember(e.target.checked);toast(tr(e.target.checked?'remOn':'remOff'))};$('#out').onclick=()=>logout();
  $('#cp').onsubmit=async e=>{e.preventDefault();const m=$('#cp-msg');const nw=$('#c-new').value;if(nw.length<6){m.className='err';m.textContent=tr('errPwShort');return}
    try{await changePassword($('#c-old').value,nw);m.className='ok';m.textContent=tr('pwChangedBk');$('#c-old').value='';$('#c-new').value=''}catch(x){m.className='err';m.textContent=tr('errCurPw')}};
  $('#nrc').onclick=async()=>{const code=await newRecoveryCode();route('recoveryShow',{code,first:false})};
  $('#del').onclick=()=>{$('#confirm').innerHTML=`<div class="confirm"><span>${esc(tr('delQ'))}</span><button class="btn sm" id="c-yes" style="background:var(--bad);border-color:var(--bad)">${esc(tr('del'))}</button><button class="btn ghost sm" id="c-no">${esc(tr('cancel'))}</button></div>`;$('#c-yes').onclick=deleteAccount;$('#c-no').onclick=()=>$('#confirm').innerHTML=''};
  if(opt&&opt.focus==='backup')$('#backup').scrollIntoView({block:'start'})}

/* ---------- Boot ---------- */
window.addEventListener('pagehide',()=>{if(S&&!S.guest)persistNow()});
applyChrome();
(async()=>{if(await tryRemembered())route('home');else route('welcome')})();
})();
</script>

</body>
</html>
